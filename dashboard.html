<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script>
  // Block MB4/MB5 from triggering WebView2 back/forward
  (function(){
    var block = function(e){
      if (e.button === 3 || e.button === 4) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return false;
      }
    };
    ['mousedown','mouseup','auxclick','contextmenu','pointerdown','pointerup'].forEach(function(ev){
      window.addEventListener(ev, block, true);
      document.addEventListener(ev, block, true);
    });
  })();

  // Neutralize history back/forward so MB4/MB5 can't navigate
  window.addEventListener('load', function(){
    try { history.pushState(null, '', location.href); } catch(e) {}
  });
  window.addEventListener('popstate', function(){
    try { history.pushState(null, '', location.href); } catch(e) {}
  });
</script>   
<style>
:root{--text:#F2F3F5;--muted:#A9AFB8;--dim:#7B828C;--hair:rgba(255,255,255,.06);--panel:rgba(255,255,255,.045);--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#0e1218;color:var(--text);font:400 13px/1.45 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:stretch;padding:0;overflow:hidden}
body.ui-bg{background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
body.ui-bg::before{content:"";position:fixed;inset:0;background:rgba(12,12,14,.55);pointer-events:none;z-index:0}
body.ui-bg .win{position:relative;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),rgba(9,14,12,.55);backdrop-filter:blur(15px) saturate(140%);-webkit-backdrop-filter:blur(15px) saturate(140%)}
body.ui-bg .scene{opacity:0;pointer-events:none;transition:opacity .3s ease}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ============================================================
   SLIDER DRAG FIX — only .title is draggable
   ============================================================ */

/* Title bar is the only draggable region */
.title {
  -webkit-app-region: drag;
  app-region: drag;
}

/* Buttons and interactive elements inside the title must be clickable */
.title button,
.title .wc,
.title .wc button,
.title .state {
  -webkit-app-region: no-drag;
  app-region: no-drag;
}

/* Everything else — no drag, so sliders/buttons/inputs work */
input[type=range],
button,
input,
textarea,
select,
label,
a,
.sl,
.fill-slider,
.dd,
.dd-btn,
.dd-menu,
.dd-menu button,
.seg,
.seg button,
.btn,
.keybtn,
.sw,
.toggle,
.overlay,
.modal,
.modal input,
.modal textarea,
.modal-actions,
.modal-actions .btn,
.ctxmenu,
.ctxmenu button,
.urlrow,
.urlrow input,
.session,
#toast {
  -webkit-app-region: no-drag;
  app-region: no-drag;
}

/* Extra safety for sliders specifically */
input[type=range] {
  -webkit-app-region: no-drag !important;
  app-region: no-drag !important;
  pointer-events: auto !important;
}

button,input,textarea,select,label,a,
.side,.nav,.nav button,.search,.search input,.search kbd,
.content,.main,.body,.grp,.panel,.row,.txt,.mono,
.sw,.toggle,.dd,.dd-btn,.dd-menu,.dd-menu button,
.sl,.fill-slider,input[type=range],.seg,.seg button,
.btn,.keybtn,.overview-tool,.card,.weapon-cards,.weapon-card,
.ccard,.cfgtop,.grid2,.cfg-modal,.cfg-modal input,.cfg-modal textarea,
.cfg-modal-actions,.cfg-modal-actions .text-button,
.bez,.bez svg,.rail,.mrow,.reads,
.ctxmenu,.ctxmenu button,.overlay,.modal,.modal input,.modal textarea,
.modal-actions,.modal-actions .btn,.session,#toast,
.urlrow,.urlrow input{-webkit-app-region:no-drag;app-region:no-drag}

input[type=range],.sl input[type=range]{
  -webkit-app-region:no-drag !important;
  app-region:no-drag !important;
  pointer-events:auto !important;
  user-select:none;
}

/* ============================================================
   Layout
   ============================================================ */

.scene{position:fixed;inset:0;z-index:0;background:#0e1218 url("https://cdn.corenexis.com/f/0yjd54ZW.webp") center/cover no-repeat}
.scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}

.win{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:44px 1fr;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.025)),rgba(9,14,12,.7);
  backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%)}
.title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 20px}
.brand{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);transition:color .2s}
.state svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.state.busy{color:var(--text)}
.wc{display:flex;gap:2px;justify-self:end}
.wc button{width:36px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:13px}
.wc button:hover{background:rgba(255,255,255,.1);color:#fff}

.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}

.side{display:flex;flex-direction:column;padding:6px 12px 14px 14px;min-height:0}
.search{position:relative;margin-bottom:16px}
.search svg{position:absolute;left:11px;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:36px;padding:0 34px 0 33px;border:0;border-radius:10px;background:rgba(255,255,255,.07);outline:0;transition:background .15s}
.search input::placeholder{color:var(--dim)}
.search input:focus{background:rgba(255,255,255,.12)}
.search kbd{position:absolute;right:9px;top:50%;margin-top:-9px;height:18px;min-width:18px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--dim);font:500 10.5px/18px var(--mono);text-align:center}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav small{padding:12px 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.nav small:first-child{padding-top:0}
.nav button{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:500;text-align:left;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.nav button i{font:500 10.5px var(--mono);font-style:normal;color:var(--dim)}
.ver{margin-top:auto;padding:0 10px;font:400 11px var(--mono);color:var(--dim)}

.content>*{max-width:920px}
.content{overflow-y:auto;padding:6px 48px 110px 24px;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.ph{display:flex;align-items:baseline;gap:12px;height:36px;margin-bottom:2px}
.ph b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ph span{color:var(--dim);font-size:12.5px}
.grp{margin-top:18px}
.grp h3{margin:0 0 8px 2px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.panel{padding:0 16px;border-radius:12px;background:var(--panel)}
.row{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:52px;padding:9px 0}
.row+.row{border-top:1px solid var(--hair)}
.txt{min-width:0}
.txt b{display:block;font-size:13.5px;font-weight:500}
.txt span{display:block;margin-top:1px;font-size:12px;color:var(--dim)}
.mono{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:40px 0;text-align:center;color:var(--dim)}

.gone{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:rgba(12,12,14,.88)}
.gone b{font-size:16px;font-weight:600}
.gone span{color:var(--muted);margin-bottom:12px}

.session{position:fixed;right:18px;bottom:14px;z-index:5;font:500 11px var(--mono);color:var(--dim);pointer-events:none}

.sw{position:relative;flex:none;width:36px;height:21px;padding:0;border:0;border-radius:11px;background:rgba(255,255,255,.16);transition:background .18s}
.sw::after{content:"";position:absolute;left:2.5px;top:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s,background .18s}
.sw[aria-checked="true"]{background:#fff}
.sw[aria-checked="true"]::after{transform:translateX(15px);background:#10151a}

.dd{position:relative;flex:none}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:150px;height:32px;padding:0 10px 0 12px;border:0;border-radius:8px;background:rgba(255,255,255,.08);font-weight:500;transition:background .12s}
.dd-btn:hover,.dd-btn[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.dd-btn svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dd-menu{position:absolute;right:0;top:38px;z-index:10;min-width:100%;padding:4px;border-radius:10px;background:rgba(11,16,14,.98);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.07)}
.dd-menu[hidden]{display:none}
.dd-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:30px;padding:0 9px;border:0;border-radius:6px;background:none;text-align:left;white-space:nowrap}
.dd-menu button:hover{background:rgba(255,255,255,.09)}
.dd-menu button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.12)}

.sl{display:flex;align-items:center;gap:14px;width:290px;flex:none}
.sl .mono{width:78px;text-align:right}
input[type=range]{flex:1;min-width:0;height:20px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,255,255,0);transition:box-shadow .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,255,255,.16)}

.seg{display:flex;flex:none;padding:2px;border-radius:9px;background:rgba(255,255,255,.08)}
.seg button{height:28px;min-width:44px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:500;transition:background .12s,color .12s}
.seg button:hover{color:#fff}
.seg button[aria-checked="true"]{background:#fff;color:#10151a}

.btn{height:32px;padding:0 14px;border:0;border-radius:8px;background:rgba(255,255,255,.09);font-weight:500;transition:background .12s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:#fff;color:#10151a;font-weight:600}
.btn.primary:hover{background:#e6e8ec}
.keybtn{min-width:64px;font:500 12px var(--mono)}
.keybtn.cap{background:#fff;color:#10151a}
.btn:disabled{opacity:.5;pointer-events:none}

.card{flex:1;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04)}
.card h4{margin:0 0 4px;font-size:13px;font-weight:600}

.urlrow{display:flex;flex-direction:column;gap:6px;padding:9px 0}
.urlrow label{font-size:11px;color:var(--dim)}
.urlrow input{width:100%;padding:9px 11px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04);outline:0;font-size:12.5px}
.urlrow input:focus{border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.07)}

.cfgtop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccard{padding:14px;border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:9px;min-width:0;cursor:context-menu}
.ccard h4{margin:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.ccard .ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ccard .meta{font-size:11px;color:var(--dim)}
.badge{flex:none;font:500 10px var(--mono);letter-spacing:.06em;color:var(--dim)}
.badge.pub{color:#fff}
.ccard .desc{font-size:12px;color:var(--muted);line-height:1.5;min-height:18px}
.ctxmenu{position:fixed;z-index:40;min-width:186px;padding:6px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03)),rgba(13,18,16,.85);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);
  opacity:0;transform:scale(.95);transform-origin:top left;transition:opacity .12s ease,transform .12s ease;pointer-events:none}
.ctxmenu[hidden]{display:none}
.ctxmenu.show{opacity:1;transform:scale(1);pointer-events:auto}
.ctxmenu button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--text);font-size:12.5px;font-weight:500;text-align:left;transition:background .1s}
.ctxmenu button svg{width:14px;height:14px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctxmenu button:hover{background:rgba(255,255,255,.1)}
.ctxmenu button:hover svg{stroke:#fff}
.ctxmenu .sep{height:1px;margin:5px 8px;background:rgba(255,255,255,.08)}
.modal label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
.modal .field{margin-bottom:0}
.vfield{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.vfield label{margin-bottom:0}
.modal input[type=text],.modal textarea{width:100%;padding:9px 11px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04);outline:0;font-size:12.5px;resize:vertical;transition:border-color .15s,background .15s}
.modal input[type=text]:focus,.modal textarea:focus{border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.07)}

.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(600px,94vw);max-height:92vh;overflow:auto;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),rgba(12,17,15,.94);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(8px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.overlay.show .modal{transform:none}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mh h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.mh p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.mx{width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted);font-size:13px}
.mx:hover{background:rgba(255,255,255,.14);color:#fff}
.bez{padding:12px 12px 6px;border-radius:12px;background:var(--panel)}
.bez svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.bez .base{stroke:rgba(255,255,255,.1);stroke-width:1}
.bez .ref{stroke:rgba(255,255,255,.14);stroke-width:1;stroke-dasharray:2 5}
.bez .fill{fill:rgba(255,255,255,.055)}
.bez .curve{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.bez .arm{stroke:rgba(255,255,255,.3);stroke-width:1}
.bez .end{fill:#fff}
.bez .ring{fill:rgba(255,255,255,.14);opacity:0;transition:opacity .15s}
.bez .h{cursor:grab}
.bez .h:hover .ring,.bez .h.drag .ring{opacity:1}
.bez .h.drag{cursor:grabbing}
.bez .knob{fill:#fff}
.bez text{fill:var(--dim);font:500 10px var(--mono)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mrow .seg button{min-width:0;padding:0 11px}
.reads{display:flex;gap:6px}
.reads span{padding:5px 10px;border-radius:8px;background:var(--panel);font:500 11.5px var(--mono);color:var(--muted)}
.reads b{color:var(--text);font-weight:500}
.rail{position:relative;height:46px;border-radius:12px;background:var(--panel)}
.rail::before{content:"";position:absolute;left:24px;right:24px;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:rgba(255,255,255,.12)}
.rail i{position:absolute;left:8px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:#cfd3d8 url("https://cdn.pfps.gg/pfps/7772-475932-sad-bart-simpson.png") center/cover}
.rail small{position:absolute;right:12px;top:-18px;font:500 10px var(--mono);color:var(--dim);letter-spacing:.04em}
.mact{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:760px){
  body{overflow:auto}
  .win{height:auto;min-height:100dvh}
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{padding:0 14px 6px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav small,.nav button i,.ver{display:none}
  .nav button{flex:none;padding:0 12px}
  .content{padding:4px 16px 90px}
  .row{flex-wrap:wrap;gap:10px}
  .sl{width:100%}
  .title{grid-template-columns:auto 1fr auto}
  .state{justify-content:center}
}
</style>
</head>
<body>
<div class="scene" role="presentation"></div>

<div class="win" id="win">
  <div class="title">
    <span class="brand">Light</span>
    <span class="state" id="state"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span id="stt">Saved</span></span>
    <div class="wc"><button aria-label="Close" id="closeBtn">✕</button></div>
  </div>

  <div class="body">
    <aside class="side">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="text" placeholder="Search settings" aria-label="Search settings" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <nav class="nav" id="nav" role="tablist" aria-label="Settings sections"></nav>
      <div class="ver">v2.8.1 · stable</div>
    </aside>
    <main class="content" id="content" role="tabpanel"></main>
  </div>
</div>

<div class="session" id="sessionBar">00:00:00</div>

<div class="overlay" id="bezierModal">
  <div class="modal" role="dialog" aria-label="Smoothing curve">
    <div class="mh">
      <div><h3>Smoothing curve</h3><p>Drag the dots to change how your aim speeds up and slows down.</p></div>
      <button class="mx" id="bezierX" aria-label="Close">✕</button>
    </div>

    <div class="bez">
      <svg id="bezSvg" viewBox="0 0 560 262" preserveAspectRatio="xMidYMid meet">
        <path class="base" d="M20 240H540"/>
        <path class="ref" d="M20 240L540 20"/>
        <path id="bFill" class="fill"/>
        <path id="bArm1" class="arm"/>
        <path id="bArm2" class="arm"/>
        <path id="bCurve" class="curve"/>
        <circle class="end" cx="20" cy="240" r="4"/>
        <circle class="end" cx="540" cy="20" r="4"/>
        <g class="h" id="bH1"><circle class="ring" r="17"/><circle class="knob" r="7"/></g>
        <g class="h" id="bH2"><circle class="ring" r="17"/><circle class="knob" r="7"/></g>
        <text x="540" y="257" text-anchor="end">TIME</text>
        <text x="20" y="11">SPEED</text>
      </svg>
    </div>

    <div class="mrow">
      <div class="seg" id="bPresets" role="radiogroup" aria-label="Curve presets"></div>
      <div class="reads"><span>P1 <b id="r1">0.27, 0.30</b></span><span>P2 <b id="r2">0.70, 0.76</b></span></div>
    </div>

    <div class="rail" aria-hidden="true"><small>PREVIEW</small><i id="bDot"></i></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

  var PARTS = ['Head','UpperTorso','LowerTorso','HumanoidRootPart'];
  var WEAPONS = [
    ['Double-Barrel SG', {AimPart:'Head', Radius:12.0, Delay:0.08}],
    ['Revolver',         {AimPart:'Head', Radius:10.0, Delay:0.15}],
    ['TacticalShotgun',  {AimPart:'Head', Radius:14.0, Delay:0.10}]
  ];
  var sec = function(x){ return (+x).toFixed(2) + ' s'; };
  var two = function(x){ return (+x).toFixed(2); };
  var one = function(x){ return (+x).toFixed(1); };
  var int = function(x){ return String(Math.round(+x)); };

  var CFG = [
    { id:'aimassist', name:'Aimassist', sub:'How it picks and follows a target', g:'Main', groups:[
      { n:'Activation', rows:[
        { t:'toggle', k:'aim',     l:'Enabled',      v:true },
        { t:'key',    k:'aimkey',  l:'Keybind',      v:'Q' },
        { t:'seg',    k:'aimmode', l:'Keybind mode', o:['Toggle','Hold'], v:'Toggle' }
      ]},
      { n:'Targeting', rows:[
        { t:'select', k:'part',    l:'Fixed part',      o:PARTS, v:'Head' },
        { t:'toggle', k:'closest', l:'Closest point',   v:true },
        { t:'toggle', k:'studchk', l:'Max studs check', v:true },
        { t:'slider', k:'studs',   l:'Max studs',       min:50, max:2000, step:10, v:500, f:int },
        { t:'toggle', k:'sticky',  l:'Sticky mode',     v:true }
      ]},
      { n:'Prediction', rows:[
        { t:'toggle', k:'predict', l:'Predict target', v:true },
        { t:'slider', k:'px',      l:'Prediction X',   min:0, max:0.5, step:0.01, v:0.10, f:two },
        { t:'slider', k:'py',      l:'Prediction Y',   min:0, max:0.5, step:0.01, v:0.10, f:two }
      ]},
      { n:'Smoothing', rows:[
        { t:'slider', k:'smooth', l:'Smoothness',          min:0, max:1, step:0.01, v:0.35, f:two },
        { t:'slider', k:'dead',   l:'Stabilizer deadzone', min:0, max:10, step:0.1, v:3.0, f:one },
        { t:'slider', k:'react',  l:'Reaction delay',      min:0, max:1, step:0.01, v:0.12, f:sec },
        { t:'button', k:'bezier', l:'Smoothing curve', b:'Edit curve' }
      ]},
      { n:'Safety', rows:[
        { t:'toggle', k:'unlock',    l:'Unlock on death',  v:true },
        { t:'toggle', k:'selfdeath', l:'Self death check', v:true }
      ]}
    ]},
    { id:'triggerbot', name:'Triggerbot', sub:'When and how it fires', g:'Main', groups:[
      { n:'Activation', rows:[
        { t:'toggle', k:'trig',     l:'Enabled',         v:false },
        { t:'key',    k:'trigkey',  l:'Keybind',         v:'E' },
        { t:'seg',    k:'trigmode', l:'Keybind mode',    o:['Toggle','Hold'], v:'Hold' },
        { t:'toggle', k:'camlock',  l:'Require camlock', v:true }
      ]},
      { n:'Target mode', rows:[
        { t:'seg',    k:'tmode',     l:'Mode',            o:['Automatic','Target'], v:'Automatic' },
        { t:'key',    k:'selectkey', l:'Target key',      v:'T' },
        { t:'info',   l:'Current target', infoKey:'selectedTarget' }
      ]},
      { n:'Targeting', rows:[
        { t:'select', k:'tpart',  l:'Aim part',        o:PARTS, v:'Head' },
        { t:'slider', k:'rad',    l:'Radius',          min:1, max:30, step:0.5, v:12.0, f:one },
        { t:'slider', k:'tdelay', l:'Delay',           min:0, max:1, step:0.01, v:0.12, f:sec },
        { t:'slider', k:'tgun',   l:'Gunswitch delay', min:0, max:2, step:0.01, v:0.0, f:sec },
        { t:'toggle', k:'tstud',  l:'Stud check',      v:true },
        { t:'slider', k:'tstuds', l:'Max studs',       min:50, max:2000, step:10, v:500, f:int }
      ]},
      { n:'Safety', rows:[
        { t:'toggle', k:'tdeath', l:'Death check',      v:true },
        { t:'toggle', k:'tself',  l:'Self death check', v:true }
      ]},
      { n:'Weapons', rows:[
        { t:'toggle', k:'wspec', l:'Weapon specific', d:'Give each weapon its own numbers.', v:false, re:true }
      ].concat(WEAPONS.map(function(w, i){ return { t:'weapon', k:'w'+i, wname:w[0], when:'wspec' }; }))}
    ]},
    { id:'movement', name:'Movement', sub:'Your macro', g:'Player', groups:[
      { n:'Macro', rows:[
        { t:'toggle', k:'macro', l:'Enabled',      v:false },
        { t:'key',    k:'mkey',  l:'Keybind',      v:'F' },
        { t:'seg',    k:'mmode', l:'Keybind mode', o:['Toggle','Hold'], v:'Toggle' },
        { t:'seg',    k:'mout',  l:'Output mode',  o:['Keyboard','Mouse'], v:'Keyboard' }
      ]},
      { n:'Sequence', rows:[
        { t:'slider', k:'mdelay', l:'Delay',            min:0, max:1, step:0.01, v:0.05, f:sec },
        { t:'toggle', k:'mself',  l:'Self death check', v:true }
      ]}
    ]},
    { id:'settings', name:'Settings', sub:'Appearance, privacy and account', g:'Settings', groups:[
      { n:'Appearance', rows:[
        { t:'toggle', k:'uibg',      l:'Custom background', d:'Use a background image behind the UI.', v:false },
        { t:'url',    k:'uibgurl',   l:'Image URL',          v:'' }
      ]},
      { n:'Account', rows:[
        { t:'info',  l:'Username', infoKey:'username' },
        { t:'info',  l:'Session',  infoKey:'session'  },
        { t:'info',  l:'HWID',     infoKey:'hwid'     },
        { t:'info',  l:'Client',   infoKey:'client'   }
      ]},
      { n:'Privacy', rows:[
        { t:'toggle', k:'stream', l:'Stream proof',     d:'Keeps this window out of screen shares and recordings.', v:false },
        { t:'key',    k:'webkey', l:'Webview keybind',  v:'F8' }
      ]},
      { n:'Exit', rows:[
        { t:'button', k:'destruct', l:'Self destruct', d:'Closes the menu and wipes your settings.', b:'Self destruct' }
      ]}
    ]},
    { id:'configs', name:'Configs', sub:'Your saved setups', g:'Configs', special:'configs', groups:[] }
  ];

  var S = {}, D = {}, weaponConfigs = {}, info = {};
  CFG.forEach(function(p){ p.groups.forEach(function(g){ g.rows.forEach(function(r){ if (r.k && r.v !== undefined) D[r.k] = r.v; }); }); });

  var CURVE_DEFAULT = { p1:{x:0.27,y:0.30}, p2:{x:0.70,y:0.76} };
  var curve = { p1:{x:0.27,y:0.30}, p2:{x:0.70,y:0.76} };

  function resetState(){
    S = {}; for (var k in D) S[k] = D[k];
    weaponConfigs = {};
    WEAPONS.forEach(function(w){ weaponConfigs[w[0]] = Object.assign({}, w[1]); });
    curve = { p1:Object.assign({}, CURVE_DEFAULT.p1), p2:Object.assign({}, CURVE_DEFAULT.p2) };
    info.selectedTarget = null;
    info.hwid = '—';
    info.client = '—';
  }
  resetState();

  var nav = $('nav'), content = $('content'), stateEl = $('state'), stt = $('stt'), q = $('q');
  var cur = 'aimassist', saveTimer = null, capturing = false;

  function toBackend(){
    var cp1 = { x: Math.round(curve.p1.x * 600), y: Math.round((1 - curve.p1.y) * 310) };
    var cp2 = { x: Math.round(curve.p2.x * 600), y: Math.round((1 - curve.p2.y) * 310) };
    return {
      Enabled: S.aim,
      Keybind: S.aimkey,
      KeybindMode: String(S.aimmode).toLowerCase(),
      WebviewKeybind: S.webkey,
      PredictTarget: S.predict,
      PredictionX: S.px,
      PredictionY: S.py,
      ClosestPoint: S.closest,
      FixedPart: S.part,
      Smoothness: S.smooth,
      MaxStudsCheck: S.studchk,
      MaxStuds: S.studs,
      UnlockOnDeath: S.unlock,
      SelfDeathCheck: S.selfdeath,
      StickyMode: S.sticky,
      StabilizerDeadzone: S.dead,
      ReactionDelay: S.react,
      Streamproof: S.stream,
      CurveP1: cp1,
      CurveP2: cp2,
      UIBackground: {
        Enabled: S.uibg === true,
        URL: (S.uibgurl || '').trim()
      },
      triggerbot: {
        Enabled: S.trig,
        Keybind: S.trigkey,
        KeybindMode: String(S.trigmode).toLowerCase(),
        RequireCamlock: S.camlock,
        AimPart: S.tpart,
        Radius: S.rad,
        Delay: S.tdelay,
        GunswitchDelay: S.tgun,
        StudCheck: S.tstud,
        MaxStuds: S.tstuds,
        DeathCheck: S.tdeath,
        SelfDeathCheck: S.tself,
        WeaponSpecific: S.wspec,
        WeaponConfigs: weaponConfigs,
        TargetMode: String(S.tmode).toLowerCase() === 'target' ? 'target' : 'automatic',
        SelectedTarget: (typeof info.selectedTarget === 'string' && info.selectedTarget) ? info.selectedTarget : null,
        SelectTargetKey: S.selectkey
      },
      macro: {
        Enabled: S.macro,
        Keybind: S.mkey,
        KeybindMode: String(S.mmode).toLowerCase(),
        OutputMode: String(S.mout).toLowerCase(),
        Keys: ['I','O'],
        Delay: S.mdelay,
        SelfDeathCheck: S.mself
      }
    };
  }

  function fromBackend(c){
    if (!c || typeof c !== 'object') return;
    var set = function(k, v){ S[k] = v; };
    set('aim',       c.Enabled !== false);
    set('aimkey',    c.Keybind || 'Q');
    set('aimmode',   String(c.KeybindMode || 'toggle').toLowerCase() === 'hold' ? 'Hold' : 'Toggle');
    set('webkey',    c.WebviewKeybind || 'F8');
    set('predict',   c.PredictTarget !== false);
    set('px',        c.PredictionX !== undefined ? c.PredictionX : 0.10);
    set('py',        c.PredictionY !== undefined ? c.PredictionY : 0.10);
    set('closest',   c.ClosestPoint !== false);
    set('part',      c.FixedPart || 'Head');
    set('smooth',    c.Smoothness !== undefined ? c.Smoothness : 0.35);
    set('studchk',   c.MaxStudsCheck !== false);
    set('studs',     c.MaxStuds !== undefined ? c.MaxStuds : 500);
    set('unlock',    c.UnlockOnDeath !== false);
    set('selfdeath', c.SelfDeathCheck !== false);
    set('sticky',    c.StickyMode !== false);
    set('dead',      c.StabilizerDeadzone !== undefined ? c.StabilizerDeadzone : 3.0);
    set('react',     c.ReactionDelay !== undefined ? c.ReactionDelay : 0.12);
    set('stream',    c.Streamproof === true);
    if (c.CurveP1 && typeof c.CurveP1.x === 'number') {
      curve.p1 = { x: Math.max(0, Math.min(1, c.CurveP1.x / 600)), y: Math.max(0, Math.min(1, 1 - c.CurveP1.y / 310)) };
    }
    if (c.CurveP2 && typeof c.CurveP2.x === 'number') {
      curve.p2 = { x: Math.max(0, Math.min(1, c.CurveP2.x / 600)), y: Math.max(0, Math.min(1, 1 - c.CurveP2.y / 310)) };
    }

    var bg = c.UIBackground || {};
    set('uibg',    bg.Enabled === true);
    set('uibgurl', bg.URL || '');

    var tb = c.triggerbot || {};
    set('trig',       tb.Enabled === true);
    set('trigkey',    tb.Keybind || 'E');
    set('trigmode',   String(tb.KeybindMode || 'hold').toLowerCase() === 'toggle' ? 'Toggle' : 'Hold');
    set('camlock',    tb.RequireCamlock !== false);
    set('tpart',      tb.AimPart || 'Head');
    set('rad',        tb.Radius !== undefined ? tb.Radius : 12.0);
    set('tdelay',     tb.Delay !== undefined ? tb.Delay : 0.12);
    set('tgun',       tb.GunswitchDelay !== undefined ? tb.GunswitchDelay : 0.0);
    set('tstud',      tb.StudCheck !== false);
    set('tstuds',     tb.MaxStuds !== undefined ? tb.MaxStuds : 500);
    set('tdeath',     tb.DeathCheck !== false);
    set('tself',      tb.SelfDeathCheck !== false);
    set('wspec',      tb.WeaponSpecific === true);
    set('tmode',      String(tb.TargetMode || 'automatic').toLowerCase() === 'target' ? 'Target' : 'Automatic');
    set('selectkey',  tb.SelectTargetKey || 'T');
    info.selectedTarget = tb.SelectedTarget || null;
    if (tb.WeaponConfigs && typeof tb.WeaponConfigs === 'object') {
      weaponConfigs = {};
      for (var w in tb.WeaponConfigs) weaponConfigs[w] = tb.WeaponConfigs[w];
      WEAPONS.forEach(function(w){ if (!weaponConfigs[w[0]]) weaponConfigs[w[0]] = Object.assign({}, w[1]); });
    }

    var mc = c.macro || {};
    set('macro',  mc.Enabled === true);
    set('mkey',   mc.Keybind || 'F');
    set('mmode',  String(mc.KeybindMode || 'toggle').toLowerCase() === 'hold' ? 'Hold' : 'Toggle');
    set('mout',   String(mc.OutputMode || 'keyboard').toLowerCase() === 'mouse' ? 'Mouse' : 'Keyboard');
    set('mdelay', mc.Delay !== undefined ? mc.Delay : 0.05);
    set('mself',  mc.SelfDeathCheck !== false);
  }

  function applyUIBackground(){
    if (S.uibg === true && S.uibgurl) {
      document.body.style.backgroundImage = 'url("' + S.uibgurl.replace(/"/g, '\\"') + '")';
      document.body.classList.add('ui-bg');
    } else {
      document.body.style.backgroundImage = '';
      document.body.classList.remove('ui-bg');
    }
  }

  async function saveConfig(){
    try {
      var r = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(toBackend())
      });
      if (!r.ok) stt.textContent = 'Save failed';
    } catch (e) {
      stt.textContent = 'Save error';
    }
  }

  async function loadConfig(){
    try {
      var r = await fetch('/api/config', { credentials: 'include' });
      if (!r.ok) return;
      var cfg = await r.json();
      if (cfg && Object.keys(cfg).length) fromBackend(cfg);
    } catch (e) {}
  }

  async function loadAccount(){
    try {
      var r = await fetch('/api/me', { credentials: 'include' });
      var d = await r.json();
      if (!d.authenticated) { window.location.href = '/'; return; }
      info.username = d.username || 'user';
      info.session  = 'Authenticated';
      try {
        var dr = await fetch('/api/dashboard', { credentials: 'include' });
        if (dr.ok) {
          var dd = await dr.json();
          info.hwid = dd.hwid || 'not bound';
        }
      } catch (e) {}
      refreshClientStatus();
      setInterval(refreshClientStatus, 3000);
    } catch (e) {
      info.username = '—'; info.session = 'unable to verify';
    }
  }

  async function refreshClientStatus(){
    if (!info.username) return;
    try {
      var r = await fetch('/api/client/status-by-user/' + encodeURIComponent(info.username), { credentials: 'include' });
      if (!r.ok) return;
      var d = await r.json();
      info.client = d.connected ? 'Connected' : 'Offline';
      if (cur === 'settings') {
        [].forEach.call(content.querySelectorAll('.row'), function(row){
          var b = row.querySelector('.txt b');
          var v = row.querySelector('.mono');
          if (b && b.textContent === 'Client' && v) v.textContent = info.client;
        });
      }
    } catch (e) {}
  }

  var CONFIGS = [], configTab = 'private';

  async function refreshConfigs(){
    try {
      var r = await fetch('/api/configs', { credentials: 'include' });
      if (!r.ok) { CONFIGS = []; return; }
      var d = await r.json();
      CONFIGS = (d.configs || []).map(function(c){
        return {
          id: c.id,
          name: c.name,
          desc: '',
          visibility: c.visibility || 'private',
          created: c.created_at ? Date.parse(c.created_at) : Date.now(),
          backend: c.data || {}
        };
      });
    } catch (e) {
      CONFIGS = [];
    }
  }

  function snapshotCurrent(){ return JSON.parse(JSON.stringify(toBackend())); }
  function applySnapshot(backend){ if (backend && typeof backend === 'object') fromBackend(backend); }

  function esc(str){ return String(str).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
  function when(ts){
    var diff = (Date.now() - ts) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return new Date(ts).toLocaleDateString();
  }

  function saved(){
    stateEl.classList.add('busy'); stt.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      saveConfig();
      stateEl.classList.remove('busy'); stt.textContent = 'Saved';
    }, 500);
  }
  function closeMenus(except){
    [].forEach.call(document.querySelectorAll('.dd-menu'), function(m){
      if (m !== except){ m.hidden = true; var b = m.previousSibling; if (b && b.setAttribute) b.setAttribute('aria-expanded','false'); }
    });
  }

  function control(r){
    if (r.t === 'info') {
      var val = info[r.infoKey];
      return el('span', 'mono', val || '—');
    }
    if (r.t === 'url') {
      var wrap = el('div', 'urlrow');
      var input = document.createElement('input');
      input.type = 'text';
      input.value = S[r.k] || '';
      input.placeholder = 'https://example.com/image.png';
      input.addEventListener('input', function(){ S[r.k] = input.value; });
      input.addEventListener('change', function(){ applyUIBackground(); saved(); });
      wrap.appendChild(input);
      return wrap;
    }
        if (r.t === 'key') {
      var kb = el('button', 'btn keybtn', S[r.k]);
      kb.setAttribute('aria-label', r.l + ' (click to change)');
      kb.onclick = function(e){
        e.stopPropagation();
        kb.textContent = 'Press a key…'; kb.classList.add('cap'); capturing = true;

        function done(ev){
          ev.preventDefault(); ev.stopPropagation();
          if (ev.key !== 'Escape') {
            var map = {' ':'Space', Control:'Ctrl', Escape:'Esc'}, k = ev.key;
            S[r.k] = map[k] || (k.length === 1 ? k.toUpperCase() : k);
            saved();
          }
          kb.textContent = S[r.k]; kb.classList.remove('cap'); capturing = false;
          document.removeEventListener('keydown', done, true);
          document.removeEventListener('mousedown', doneMB, true);
        }

        function doneMB(ev){
          if (ev.button === 3) {
            ev.preventDefault(); ev.stopPropagation();
            S[r.k] = 'MB4';
            saved();
            kb.textContent = 'MB4'; kb.classList.remove('cap'); capturing = false;
            document.removeEventListener('keydown', done, true);
            document.removeEventListener('mousedown', doneMB, true);
          } else if (ev.button === 4) {
            ev.preventDefault(); ev.stopPropagation();
            S[r.k] = 'MB5';
            saved();
            kb.textContent = 'MB5'; kb.classList.remove('cap'); capturing = false;
            document.removeEventListener('keydown', done, true);
            document.removeEventListener('mousedown', doneMB, true);
          }
        }

        document.addEventListener('keydown', done, true);
        document.addEventListener('mousedown', doneMB, true);
      };
      return kb;
    }
    if (r.t === 'toggle') {
      var b = el('button', 'sw');
      b.setAttribute('role','switch'); b.setAttribute('aria-label', r.l);
      b.setAttribute('aria-checked', S[r.k] ? 'true' : 'false');
      b.onclick = function(){
        S[r.k] = !S[r.k];
        b.setAttribute('aria-checked', S[r.k] ? 'true' : 'false');
        if (r.k === 'uibg') applyUIBackground();
        saved();
        if (r.re) renderKeep();
      };
      return b;
    }
    if (r.t === 'select') {
      var w = el('div','dd'), lab = el('span','', S[r.k]), btn = el('button','dd-btn'), m = el('div','dd-menu');
      btn.appendChild(lab);
      btn.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>');
      btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false'); btn.setAttribute('aria-label', r.l);
      m.hidden = true; m.setAttribute('role','listbox');
      r.o.forEach(function(o){
        var i = el('button','', o);
        i.setAttribute('role','option'); i.setAttribute('aria-selected', o === S[r.k] ? 'true' : 'false');
        i.onclick = function(e){
          e.stopPropagation(); S[r.k] = o; lab.textContent = o; m.hidden = true; btn.setAttribute('aria-expanded','false');
          [].forEach.call(m.children, function(x){ x.setAttribute('aria-selected', x === i ? 'true' : 'false'); });
          saved();
        };
        m.appendChild(i);
      });
      btn.onclick = function(e){
        e.stopPropagation(); var open = m.hidden; closeMenus(m); m.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      w.appendChild(btn); w.appendChild(m);
      return w;
    }
    if (r.t === 'slider') {
      var s = el('div','sl'), inp = el('input'), v = el('span','mono');
      inp.type = 'range'; inp.min = r.min; inp.max = r.max; inp.step = r.step; inp.value = S[r.k]; inp.setAttribute('aria-label', r.l);
      var paint = function(){ inp.style.setProperty('--p', ((inp.value - r.min) / (r.max - r.min) * 100) + '%'); v.textContent = r.f(+inp.value); };
      inp.oninput = function(){ S[r.k] = +inp.value; paint(); };
      inp.onchange = saved;
      paint(); s.appendChild(inp); s.appendChild(v);
      return s;
    }
    if (r.t === 'seg') {
      var g = el('div','seg'); g.setAttribute('role','radiogroup'); g.setAttribute('aria-label', r.l);
      r.o.forEach(function(o){
        var bb = el('button','', o);
        bb.setAttribute('role','radio'); bb.setAttribute('aria-checked', o === S[r.k] ? 'true' : 'false');
        bb.onclick = function(){
          S[r.k] = o;
          [].forEach.call(g.children, function(x){ x.setAttribute('aria-checked', x === bb ? 'true' : 'false'); });
          saved();
          if (r.k === 'tmode') renderKeep();
        };
        g.appendChild(bb);
      });
      return g;
    }
    if (r.t === 'button') {
      var bt = el('button', 'btn', r.b);
      bt.onclick = function(){
        if (r.k === 'destruct') {
          if (!bt.dataset.arm) {
            bt.dataset.arm = '1'; bt.textContent = 'Click again to confirm';
            setTimeout(function(){ if (bt.dataset.arm){ delete bt.dataset.arm; bt.textContent = r.b; } }, 3000);
            return;
          }
          closeSession(true); return;
        }
        if (r.k === 'bezier') { openBezier(); return; }
        saved();
      };
      return bt;
    }
    return el('span','mono', r.val || '');
  }

  function weaponRow(r){
    var name = r.wname, c = weaponConfigs[name], card = el('div','card');
    card.appendChild(el('h4','', name));

    var r1 = el('div','row'); r1.style.minHeight = '40px';
    r1.appendChild(el('div','txt','<b>Aim part</b>'));
    var dd = el('div','dd'), lab = el('span','', c.AimPart), btn = el('button','dd-btn'), m = el('div','dd-menu');
    btn.appendChild(lab); btn.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>');
    m.hidden = true;
    PARTS.forEach(function(o){
      var it = el('button','', o);
      it.onclick = function(e){ e.stopPropagation(); c.AimPart = o; lab.textContent = o; m.hidden = true; saved(); };
      m.appendChild(it);
    });
    btn.onclick = function(e){ e.stopPropagation(); var open = m.hidden; closeMenus(m); m.hidden = !open; };
    dd.appendChild(btn); dd.appendChild(m); r1.appendChild(dd); card.appendChild(r1);

    function slider(label, key, min, max, step, fmt){
      var row = el('div','row'); row.style.minHeight = '40px';
      row.appendChild(el('div','txt','<b>' + label + '</b>'));
      var sl = el('div','sl'), inp = el('input'), val = el('span','mono');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = c[key]; inp.setAttribute('aria-label', name + ' ' + label);
      var paint = function(){ inp.style.setProperty('--p', ((inp.value - min) / (max - min) * 100) + '%'); val.textContent = fmt(+inp.value); };
      inp.oninput = function(){ c[key] = +inp.value; paint(); };
      inp.onchange = saved; paint();
      sl.appendChild(inp); sl.appendChild(val); row.appendChild(sl); card.appendChild(row);
    }
    slider('Radius','Radius',1,30,0.5,one);
    slider('Delay','Delay',0,1,0.01,sec);
    return card;
  }

  function rowEl(r){
    if (r.t === 'weapon') { var wr = el('div','row'); wr.appendChild(weaponRow(r)); return wr; }
    if (r.t === 'url') {
      var row = el('div','row'); row.style.flexDirection = 'column'; row.style.alignItems = 'stretch';
      var t = el('div','txt'); t.appendChild(el('b','', r.l));
      if (r.d) t.appendChild(el('span','', r.d));
      row.appendChild(t);
      row.appendChild(control(r));
      return row;
    }
    var row = el('div','row'), t = el('div','txt');
    t.appendChild(el('b','', r.l));
    if (r.d) t.appendChild(el('span','', r.d));
    row.appendChild(t); row.appendChild(control(r));
    return row;
  }

  function visible(r){ return !r.when || S[r.when]; }
  function renderKeep(){ var y = content.scrollTop; render(); content.scrollTop = y; }

  function render(){
    content.innerHTML = '';
    var query = (q.value || '').trim().toLowerCase();
    if (query) {
      var n = 0;
      CFG.forEach(function(p){ p.groups.forEach(function(g){
        var hits = g.rows.filter(function(r){ return r.l && visible(r) && ((r.l + ' ' + (r.d || '')).toLowerCase().indexOf(query) > -1); });
        if (!hits.length) return;
        if (!n) content.appendChild(el('div','ph','<b>Results</b><span></span>'));
        n += hits.length;
        var grp = el('div','grp'); grp.appendChild(el('h3','', p.name + ' · ' + g.n));
        var pan = el('div','panel'); hits.forEach(function(r){ pan.appendChild(rowEl(r)); });
        grp.appendChild(pan); content.appendChild(grp);
      }); });
      if (!n) content.appendChild(el('div','empty','Nothing matches \u201C' + (q.value || '').replace(/</g,'&lt;') + '\u201D'));
      else content.querySelector('.ph span').textContent = n + (n === 1 ? ' setting' : ' settings');
      [].forEach.call(nav.querySelectorAll('button'), function(b){ b.setAttribute('aria-selected','false'); });
      return;
    }
    var p = CFG.filter(function(x){ return x.id === cur; })[0];
    content.appendChild(el('div','ph','<b>' + p.name + '</b><span>' + p.sub + '</span>'));
    if (p.special === 'configs') { renderConfigsPage(); }
    else {
      p.groups.forEach(function(g){
        var rows = g.rows.filter(visible);
        if (!rows.length) return;
        var grp = el('div','grp'); grp.appendChild(el('h3','', g.n));
        var pan = el('div','panel'); rows.forEach(function(r){ pan.appendChild(rowEl(r)); });
        grp.appendChild(pan); content.appendChild(grp);
      });
    }
    [].forEach.call(nav.querySelectorAll('button'), function(b){ b.setAttribute('aria-selected', b.dataset.id === cur ? 'true' : 'false'); });
    content.scrollTop = 0;
  }

  function renderConfigsPage(){
    var top = el('div','cfgtop');
    var seg = el('div','seg'); seg.setAttribute('role','radiogroup'); seg.setAttribute('aria-label','Library');
    [['private','Private library'],['public','Public']].forEach(function(t){
      var b = el('button','', t[1]); b.setAttribute('role','radio'); b.setAttribute('aria-checked', configTab === t[0] ? 'true' : 'false');
      b.onclick = function(){
        configTab = t[0];
        [].forEach.call(seg.children, function(x){ x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
        drawGrid();
      };
      seg.appendChild(b);
    });
    var upBtn = el('button','btn primary','Save current as config');
    upBtn.onclick = openUpload;
    top.appendChild(seg); top.appendChild(upBtn);
    content.appendChild(top);
    var grid = el('div','grid2'); grid.id = 'cfgGrid';
    content.appendChild(grid);

    grid.appendChild(el('div','empty','Loading…'));
    refreshConfigs().then(function(){ drawGrid(); });
  }

  function drawGrid(){
    var grid = $('cfgGrid'); if (!grid) return;
    grid.innerHTML = '';
    var list = CONFIGS.filter(function(c){ return c.visibility === configTab; }).sort(function(a,b){ return b.created - a.created; });
    if (!list.length) {
      grid.style.gridTemplateColumns = '1fr';
      grid.appendChild(el('div','empty', configTab === 'public'
        ? 'No public configs yet. Save one and mark it Public.'
        : 'Your private library is empty. Save a config and keep it Private to put it here.'));
      return;
    }
    grid.style.gridTemplateColumns = '';
    list.forEach(function(c){
      var card = el('div','ccard');
      card.innerHTML =
        '<div class="ctop"><h4>' + esc(c.name) + '</h4><span class="badge' + (c.visibility === 'public' ? ' pub' : '') + '">' + (c.visibility === 'public' ? 'Public' : 'Private') + '</span></div>' +
        '<div class="meta">Saved ' + when(c.created) + '</div>' +
        '<div class="desc">' + (c.desc ? esc(c.desc) : 'Saved config') + '</div>';
      card.addEventListener('contextmenu', function(e){ e.preventDefault(); openCtx(e.clientX, e.clientY, c); });
      grid.appendChild(card);
    });
  }

  var CTX_ICONS = {
    load: '<path d="M4 3l8 5-8 5z"/>',
    vis:  '<path d="M1 8s2.7-5 7-5 7 5 7 5-2.7 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2.2"/>',
    del:  '<path d="M3 4h10M6.5 4V2.6c0-.6.4-1 1-1h1c.6 0 1 .4 1 1V4M4.5 4l.6 9c0 .6.5 1 1 1h3.8c.5 0 1-.4 1-1l.6-9"/>'
  };

  function openCtx(x, y, c){
    var m = $('ctxMenu');
    m.innerHTML =
      '<button data-a="load"><svg viewBox="0 0 16 16">' + CTX_ICONS.load + '</svg>Load</button>' +
      '<button data-a="vis"><svg viewBox="0 0 16 16">' + CTX_ICONS.vis + '</svg>' + (c.visibility === 'public' ? 'Make private' : 'Make public') + '</button>' +
      '<div class="sep"></div>' +
      '<button data-a="del"><svg viewBox="0 0 16 16">' + CTX_ICONS.del + '</svg><span>Delete</span></button>';
    m.hidden = false; m.classList.remove('show');
    var r = m.getBoundingClientRect();
    m.style.left = Math.min(x, window.innerWidth - r.width - 10) + 'px';
    m.style.top = Math.min(y, window.innerHeight - r.height - 10) + 'px';
    requestAnimationFrame(function(){ m.classList.add('show'); });

    m.querySelector('[data-a="load"]').onclick = function(){
      applySnapshot(c.backend);
      applyUIBackground();
      saved();
      closeCtx();
      renderKeep();
    };

    m.querySelector('[data-a="vis"]').onclick = function(){
      var newVis = c.visibility === 'public' ? 'private' : 'public';
      fetch('/api/configs/' + c.id + '/visibility', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ visibility: newVis })
      }).then(function(){
        c.visibility = newVis;
        closeCtx();
        drawGrid();
      }).catch(function(){ closeCtx(); });
    };

    var del = m.querySelector('[data-a="del"]'), delLabel = del.querySelector('span');
    del.onclick = function(){
      if (!del.dataset.arm) { del.dataset.arm = '1'; delLabel.textContent = 'Click to confirm'; return; }
      fetch('/api/configs/' + c.id, {
        method: 'DELETE',
        credentials: 'include'
      }).then(function(){
        CONFIGS = CONFIGS.filter(function(x){ return x.id !== c.id; });
        closeCtx();
        drawGrid();
      }).catch(function(){ closeCtx(); });
    };
  }
  function closeCtx(){ var m = $('ctxMenu'); m.classList.remove('show'); m.hidden = true; m.innerHTML = ''; }

  function openUpload(){
    $('upName').value = ''; $('upDesc').value = '';
    [].forEach.call($('upVis').children, function(x){ x.setAttribute('aria-checked', x.dataset.v === 'private' ? 'true' : 'false'); });
    $('uploadModal').classList.add('show');
    $('upName').focus();
  }
  function closeUpload(){ $('uploadModal').classList.remove('show'); }
  [].forEach.call($('upVis').children, function(btn){
    btn.onclick = function(){
      [].forEach.call($('upVis').children, function(x){ x.setAttribute('aria-checked', x === btn ? 'true' : 'false'); });
    };
  });
  $('upX').onclick = closeUpload; $('upCancel').onclick = closeUpload;
  $('uploadModal').addEventListener('click', function(e){ if (e.target === $('uploadModal')) closeUpload(); });
  $('upSave').onclick = function(){
    var name = $('upName').value.trim();
    if (!name) { $('upName').focus(); return; }
    var vis = 'private';
    [].forEach.call($('upVis').children, function(x){ if (x.getAttribute('aria-checked') === 'true') vis = x.dataset.v; });
    var desc = $('upDesc').value.trim();
    var snap = snapshotCurrent();

    $('upSave').disabled = true;
    $('upSave').textContent = 'Saving…';

    fetch('/api/configs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name: name, data: snap, visibility: vis })
    }).then(function(r){
      if (!r.ok) throw new Error('save failed');
      return r.json();
    }).then(function(){
      closeUpload();
      configTab = vis;
      return refreshConfigs();
    }).then(function(){
      if (cur === 'configs') drawGrid();
    }).catch(function(){
      $('upSave').disabled = false;
      $('upSave').textContent = 'Save config';
    });
  };

  var lastG = '';
  CFG.forEach(function(p, i){
    if (p.g !== lastG) { nav.appendChild(el('small','', p.g)); lastG = p.g; }
    var b = el('button','','<span>' + p.name + '</span><i>' + (i + 1) + '</i>');
    b.dataset.id = p.id; b.setAttribute('role','tab');
    b.onclick = function(){ cur = p.id; q.value = ''; render(); };
    nav.appendChild(b);
  });

  q.addEventListener('input', render);
  document.addEventListener('click', function(){ closeMenus(); closeCtx(); });
  content.addEventListener('scroll', closeCtx);
  window.addEventListener('resize', closeCtx);
  document.addEventListener('keydown', function(e){
    if (capturing) return;
    if (e.key === 'Escape') {
      closeMenus(); closeCtx();
      if ($('uploadModal').classList.contains('show')) { closeUpload(); return; }
      if ($('bezierModal').classList.contains('show')) { closeBezier(); return; }
      if (document.activeElement === q) { q.value = ''; q.blur(); render(); }
      return;
    }
    var typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'range';
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); q.focus(); return; }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= CFG.length) { cur = CFG[n - 1].id; q.value = ''; render(); }
  });

  var start = Date.now();
  function tick(){
    var s = Math.floor((Date.now() - start) / 1000), p = function(x){ return String(x).padStart(2,'0'); };
    $('sessionBar').textContent = p(Math.floor(s / 3600)) + ':' + p(Math.floor((s % 3600) / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 1000); tick();

  function closeSession(clear){
    fetch('/api/logout', { method: 'POST', credentials: 'include' }).catch(function(){});
    fetch('/api/client/shutdown', { method: 'POST', credentials: 'include' }).catch(function(){});
    var w = $('win');
    w.style.transition = 'opacity .5s'; w.style.opacity = '0'; w.style.pointerEvents = 'none';
    setTimeout(function(){
      var m = el('div','gone','<b>Session closed</b><span>' + (clear ? 'Everything\u2019s been wiped.' : 'Signed out.') + '</span><button class="btn primary" id="again">Reopen</button>');
      document.body.appendChild(m);
      $('again').onclick = function(){
        m.remove();
        if (clear) resetState();
        start = Date.now(); q.value = ''; cur = 'aimassist'; render();
        w.style.opacity = '1'; w.style.pointerEvents = '';
        if (!clear) loadConfig().then(function(){ applyUIBackground(); render(); });
      };
    }, 600);
  }
  $('closeBtn').onclick = function(){
    var w = $('win');
    w.style.transition = 'opacity .4s'; w.style.opacity = '0'; w.style.pointerEvents = 'none';
    setTimeout(function(){
      var m = el('div','gone','<b>Panel hidden</b><span>Click Reopen to bring it back.</span><button class="btn primary" id="again">Reopen</button>');
      document.body.appendChild(m);
      $('again').onclick = function(){
        m.remove(); start = Date.now(); render();
        w.style.opacity = '1'; w.style.pointerEvents = '';
      };
    }, 450);
  };

  var X0 = 20, X1 = 540, Y0 = 240, Y1 = 20;
  var gx = function(n){ return X0 + n * (X1 - X0); }, gy = function(n){ return Y0 - n * (Y0 - Y1); };
  var svg = $('bezSvg'), drag = null, loop = null, rev = false;
  var PRESETS = [
    ['Linear',   0.33, 0.33, 0.67, 0.67],
    ['Ease in',  0.80, 0.00, 1.00, 1.00],
    ['Ease out', 0.00, 0.00, 0.20, 1.00],
    ['Smooth',   0.65, 0.00, 0.35, 1.00]
  ];
  var pr = $('bPresets');
  PRESETS.forEach(function(p){
    var b = el('button','', p[0]); b.setAttribute('role','radio'); b.setAttribute('aria-checked','false');
    b.onclick = function(){ curve.p1 = {x:p[1], y:p[2]}; curve.p2 = {x:p[3], y:p[4]}; draw(); saved(); };
    pr.appendChild(b);
  });
  function near(a, b){ return Math.abs(a - b) < 0.02; }
  function draw(){
    var a = curve.p1, b = curve.p2;
    var d = 'M' + X0 + ' ' + Y0 + ' C' + gx(a.x) + ' ' + gy(a.y) + ' ' + gx(b.x) + ' ' + gy(b.y) + ' ' + X1 + ' ' + Y1;
    $('bCurve').setAttribute('d', d);
    $('bFill').setAttribute('d', d + ' L' + X1 + ' ' + Y0 + ' Z');
    $('bArm1').setAttribute('d', 'M' + X0 + ' ' + Y0 + ' L' + gx(a.x) + ' ' + gy(a.y));
    $('bArm2').setAttribute('d', 'M' + X1 + ' ' + Y1 + ' L' + gx(b.x) + ' ' + gy(b.y));
    $('bH1').setAttribute('transform', 'translate(' + gx(a.x) + ' ' + gy(a.y) + ')');
    $('bH2').setAttribute('transform', 'translate(' + gx(b.x) + ' ' + gy(b.y) + ')');
    $('r1').textContent = a.x.toFixed(2) + ', ' + a.y.toFixed(2);
    $('r2').textContent = b.x.toFixed(2) + ', ' + b.y.toFixed(2);
    [].forEach.call(pr.children, function(btn, i){
      var p = PRESETS[i], on = near(a.x,p[1]) && near(a.y,p[2]) && near(b.x,p[3]) && near(b.y,p[4]);
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    $('bDot').style.transition = 'left 1.1s cubic-bezier(' + a.x + ',' + a.y + ',' + b.x + ',' + b.y + ')';
  }
  function pointer(ev){
    var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    var m = svg.getScreenCTM(); if (!m) return null;
    var l = pt.matrixTransform(m.inverse());
    var cl = function(v){ return Math.max(0, Math.min(1, v)); };
    return { x: cl((l.x - X0) / (X1 - X0)), y: cl((Y0 - l.y) / (Y0 - Y1)) };
  }
  [['bH1','p1'],['bH2','p2']].forEach(function(h){
    var g = $(h[0]);
    g.addEventListener('pointerdown', function(ev){ drag = h[1]; g.classList.add('drag'); g.setPointerCapture(ev.pointerId); ev.preventDefault(); });
    g.addEventListener('pointermove', function(ev){ if (drag !== h[1]) return; var p = pointer(ev); if (p) { curve[drag] = p; draw(); } });
    var end = function(){ if (drag === h[1]) { drag = null; g.classList.remove('drag'); saved(); } };
    g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  });
  function startPreview(){
    var dot = $('bDot'); clearInterval(loop); rev = false;
    var t = dot.style.transition; dot.style.transition = 'none'; dot.style.left = '8px'; void dot.offsetWidth; dot.style.transition = t;
    loop = setInterval(function(){ rev = !rev; dot.style.left = rev ? 'calc(100% - 36px)' : '8px'; }, 1500);
  }
  function openBezier(){ draw(); $('bezierModal').classList.add('show'); startPreview(); }
  function closeBezier(){ $('bezierModal').classList.remove('show'); clearInterval(loop); }
  $('bezierDone').onclick = closeBezier; $('bezierX').onclick = closeBezier;
  $('bezierModal').addEventListener('click', function(e){ if (e.target === $('bezierModal')) closeBezier(); });
  $('bezierReset').onclick = function(){ curve = { p1:Object.assign({}, CURVE_DEFAULT.p1), p2:Object.assign({}, CURVE_DEFAULT.p2) }; draw(); saved(); };

  async function pollSelectedTarget(){
    try {
      var r = await fetch('/api/config', { credentials: 'include' });
      if (!r.ok) return;
      var cfg = await r.json();
      var tb = cfg && cfg.triggerbot;
      if (tb) {
        var newSel = tb.SelectedTarget || null;
        if (newSel !== info.selectedTarget) {
          info.selectedTarget = newSel;
          if (cur === 'triggerbot') renderKeep();
        }
        var newMode = String(tb.TargetMode || 'automatic').toLowerCase() === 'target' ? 'Target' : 'Automatic';
        if (newMode !== S.tmode) {
          S.tmode = newMode;
          if (cur === 'triggerbot') renderKeep();
        }
      }
    } catch (e) {}
  }
  setInterval(pollSelectedTarget, 1500);

  (async function(){
    await loadAccount();
    await loadConfig();
    applyUIBackground();
    render();
  })();
})();
</script>
