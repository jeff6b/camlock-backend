<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--text:#F2F3F5;--muted:#A9AFB8;--dim:#7B828C;--hair:rgba(255,255,255,.06);--panel:rgba(255,255,255,.045);--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#0e1218;color:var(--text);font:400 13px/1.45 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:stretch;padding:0;overflow:hidden}
body.ui-bg{background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
body.ui-bg::before{content:"";position:fixed;inset:0;background:rgba(12,12,14,.65);pointer-events:none;z-index:0}
body.ui-bg .win{position:relative;z-index:1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.scene{position:fixed;inset:0;z-index:0;background:#0e1218 url("https://cdn.corenexis.com/f/0yjd54ZW.webp") center/cover no-repeat}
.scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}

.win{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;border-radius:0;overflow:hidden;display:grid;grid-template-rows:44px 1fr;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.025)),rgba(9,14,12,.7);
  backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);box-shadow:none}
.title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 20px;-webkit-app-region:drag;app-region:drag}
.brand{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);-webkit-app-region:no-drag;app-region:no-drag;display:flex;align-items:center;gap:10px}
.brand .session{font-family:var(--mono);font-size:11px;color:var(--dim)}
.state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);transition:color .2s;-webkit-app-region:no-drag;app-region:no-drag}
.state svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.state.busy{color:var(--text)}
.wc{display:flex;gap:2px;justify-self:end;-webkit-app-region:no-drag;app-region:no-drag}
.wc button{width:36px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:13px}
.wc button:hover{background:rgba(255,255,255,.1);color:#fff}

.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}

.side{display:flex;flex-direction:column;padding:6px 12px 14px 14px;min-height:0}
.search{position:relative;margin-bottom:16px}
.search svg{position:absolute;left:11px;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:36px;padding:0 34px 0 33px;border:0;border-radius:10px;background:rgba(255,255,255,.07);outline:0;transition:background .15s}
.search input::placeholder{color:var(--dim)}
.search input:focus{background:rgba(255,255,255,.12)}
.search kbd{position:absolute;right:9px;top:50%;margin-top:-9px;height:18px;min-width:18px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--dim);font:500 10.5px/18px var(--mono);text-align:center}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav small{padding:12px 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.nav small:first-child{padding-top:0}
.nav button{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:500;text-align:left;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.nav button i{font:500 10.5px var(--mono);font-style:normal;color:var(--dim)}
.ver{margin-top:auto;padding:0 10px;font:400 11px var(--mono);color:var(--dim)}

.content>*{max-width:920px}
.content{overflow-y:auto;padding:6px 48px 110px 24px;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.ph{display:flex;align-items:baseline;gap:12px;height:36px;margin-bottom:2px}
.ph b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ph span{color:var(--dim);font-size:12.5px}
.grp{margin-top:18px}
.grp h3{margin:0 0 8px 2px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.panel{padding:0 16px;border-radius:12px;background:var(--panel)}
.row{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:52px;padding:9px 0}
.row+.row{border-top:1px solid var(--hair)}
.txt{min-width:0}
.txt b{display:block;font-size:13.5px;font-weight:500}
.txt span{display:block;margin-top:1px;font-size:12px;color:var(--dim)}
.mono{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.gone{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:rgba(12,12,14,.85)}
.gone b{font-size:16px;font-weight:600}
.gone span{color:var(--muted);margin-bottom:12px}
.empty{padding:40px 0;text-align:center;color:var(--dim)}

.sw{position:relative;flex:none;width:36px;height:21px;padding:0;border:0;border-radius:11px;background:rgba(255,255,255,.16);transition:background .18s}
.sw::after{content:"";position:absolute;left:2.5px;top:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s,background .18s}
.sw[aria-checked="true"]{background:#fff}
.sw[aria-checked="true"]::after{transform:translateX(15px);background:#10151a}

.dd{position:relative;flex:none}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:150px;height:32px;padding:0 10px 0 12px;border:0;border-radius:8px;background:rgba(255,255,255,.08);font-weight:500;transition:background .12s}
.dd-btn:hover,.dd-btn[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.dd-btn svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dd-menu{position:absolute;right:0;top:38px;z-index:10;min-width:100%;padding:4px;border-radius:10px;background:rgba(11,16,14,.98);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.07)}
.dd-menu[hidden]{display:none}
.dd-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:30px;padding:0 9px;border:0;border-radius:6px;background:none;text-align:left;white-space:nowrap}
.dd-menu button:hover{background:rgba(255,255,255,.09)}
.dd-menu button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.12)}

.sl{display:flex;align-items:center;gap:14px;width:290px;flex:none}
.sl .mono{width:78px;text-align:right}
input[type=range]{flex:1;min-width:0;height:20px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,255,255,0);transition:box-shadow .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,255,255,.16)}

.seg{display:flex;flex:none;padding:2px;border-radius:9px;background:rgba(255,255,255,.08)}
.seg button{height:28px;min-width:44px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:500;transition:background .12s,color .12s}
.seg button:hover{color:#fff}
.seg button[aria-checked="true"]{background:#fff;color:#10151a}

.btn{height:32px;padding:0 14px;border:0;border-radius:8px;background:rgba(255,255,255,.09);font-weight:500;transition:background .12s}
.btn:hover{background:rgba(255,255,255,.16)}
.keybtn{min-width:64px;font:500 12px var(--mono)}
.keybtn.cap{background:#fff;color:#10151a}
.btn:disabled{opacity:.5;pointer-events:none}
.danger{background:rgba(220,60,60,.18);color:#ffb0b0}
.danger:hover{background:rgba(220,60,60,.28)}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(520px,92vw);max-height:80vh;overflow-y:auto;border-radius:14px;background:#10151a;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.modal h3{font-size:14px;font-weight:600;margin:0 0 4px}
.modal label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
.modal input,.modal textarea{width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.04);outline:0;font-size:12px;resize:vertical}
.modal input:focus,.modal textarea:focus{border-color:rgba(255,255,255,.2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

/* community cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{padding:12px;border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.card .meta{font-size:11px;color:var(--dim)}
.card .desc{font-size:12px;color:var(--muted);line-height:1.5;min-height:34px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--hair);padding-top:8px}
.like{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);font-size:11px;padding:3px 6px;border-radius:5px}
.like:hover{color:#fff;background:rgba(255,255,255,.06)}
.like.on{color:#ff8fa3}
.like svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.like.on svg{fill:currentColor}
.mini{padding:4px 9px;border:0;border-radius:6px;background:rgba(255,255,255,.08);font-size:11px;font-weight:500}
.mini:hover{background:rgba(255,255,255,.16)}
.mini.primary{background:rgba(255,255,255,.16)}
.mini.primary:hover{background:rgba(255,255,255,.22)}

/* bezier editor modal */
.bezier-stage{width:100%;aspect-ratio:1.85;display:block;border-radius:10px;background:#0a0f14}
.bezier-stage text{fill:var(--dim);font-size:9px}
.bezier-stage .grid{stroke:#141a20;stroke-width:1}
.bezier-stage .axis{stroke:#242a30;stroke-width:1.1}
.bezier-stage .line{stroke:#202830;stroke-width:1.1;stroke-dasharray:3 4}
.bezier-stage .path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.bezier-stage .end{fill:#0a0f14;stroke:#fff;stroke-width:1.4}
.bezier-stage .pt{fill:#fff;stroke:#0a0f14;stroke-width:2;cursor:grab}
.bezier-stage .pt:active{cursor:grabbing}

@media (max-width:760px){
  body{padding:0;overflow:auto}
  .win{height:auto;min-height:100dvh}
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{padding:0 14px 6px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav small,.nav button i,.ver{display:none}
  .nav button{flex:none;padding:0 12px}
  .content{padding:4px 16px 70px}
  .row{flex-wrap:wrap;gap:10px}
  .sl{width:100%}
  .title{grid-template-columns:auto 1fr auto}
  .state{justify-content:center}
}
</style>
</head>
<body>
<div class="scene" role="presentation"></div>

<div class="win" id="win">
  <div class="title">
    <span class="brand">
      <span>Light</span>
      <span class="session" id="sessionBar">00:00:00</span>
    </span>
    <span class="state" id="state"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span id="stt">Saved</span></span>
    <div class="wc">
      <button aria-label="Sign out" id="signOutBtn">⎋</button>
      <button aria-label="Close" id="closeBtn">✕</button>
    </div>
  </div>

  <div class="body">
    <aside class="side">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="text" placeholder="Search settings" aria-label="Search settings" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <nav class="nav" id="nav" role="tablist" aria-label="Settings sections"></nav>
      <div class="ver">v2.8.1 · stable</div>
    </aside>
    <main class="content" id="content" role="tabpanel"></main>
  </div>
</div>

<!-- Bezier curve editor modal -->
<div class="overlay" id="bezierModal">
  <div class="modal">
    <h3>Bezier curve</h3>
    <div class="meta" style="font-size:11px;color:var(--dim);margin-bottom:4px">Drag the two control points. X/Y are normalized 0–1.</div>
    <svg class="bezier-stage" id="bezierSvg" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="gpat" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M30 0 L0 0 0 30" fill="none" stroke="#141a20" stroke-width="1"/>
        </pattern>
      </defs>
      <rect x="34" y="18" width="548" height="260" fill="url(#gpat)" rx="8"/>
      <path class="axis" d="M34 278H582 M34 18V278"/>
      <text x="34" y="299">0</text><text x="572" y="299">1</text>
      <text x="15" y="28">1</text><text x="15" y="281">0</text>
      <path id="hline1" class="line" d="M34 278 L180 200"/>
      <path id="hline2" class="line" d="M420 80 L582 18"/>
      <path id="cpath" class="path" d="M34 278 C180 200 420 80 582 18"/>
      <circle class="end" cx="34" cy="278" r="5"/>
      <circle class="end" cx="582" cy="18" r="5"/>
      <circle class="pt" id="cp1" data-pt="1" cx="180" cy="200" r="7"/>
      <circle class="pt" id="cp2" data-pt="2" cx="420" cy="80" r="7"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px">
      <span>P1 <b id="pv1">27%, 30%</b></span>
      <span>P2 <b id="pv2">71%, 76%</b></span>
    </div>
    <div class="modal-actions">
      <button class="btn" id="bezierReset">Reset</button>
      <button class="btn" id="bezierClose">Done</button>
    </div>
  </div>
</div>

<!-- Publish modal -->
<div class="overlay" id="publishModal">
  <div class="modal">
    <h3>Publish config</h3>
    <div><label>Config name</label><input type="text" id="pubName" maxlength="40" placeholder="e.g. Legit smooth"></div>
    <div><label>Description</label><textarea id="pubDesc" maxlength="220" rows="3" placeholder="What makes this config good?"></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="pubCancel">Cancel</button>
      <button class="btn" id="pubConfirm">Publish</button>
    </div>
  </div>
</div>

<div id="toast" style="position:fixed;right:14px;bottom:14px;padding:9px 12px;border-radius:8px;background:#131316;color:var(--text);border:1px solid rgba(255,255,255,.08);font-size:12px;opacity:0;transform:translateY(4px);transition:.2s;pointer-events:none;z-index:100"></div>

<script>
(function(){
  // ============================================================
  // State
  // ============================================================
  var PARTS = ['Head','UpperTorso','LowerTorso','HumanoidRootPart'];
  var WEAPONS = [
    ['Double-Barrel SG', {AimPart:'Head', Radius:12.0, Delay:0.08}],
    ['Revolver',         {AimPart:'Head', Radius:10.0, Delay:0.15}],
    ['TacticalShotgun',  {AimPart:'Head', Radius:14.0, Delay:0.10}]
  ];
  var sec = function(x){ return (+x).toFixed(2) + ' s'; };
  var two = function(x){ return (+x).toFixed(2); };
  var one = function(x){ return (+x).toFixed(1); };
  var int = function(x){ return String(Math.round(+x)); };

  // The settings schema — mirrors old config keys so /api/config round-trips.
  var CFG = [
    { id:'aimassist', name:'Aimassist', sub:'Targeting, prediction and smoothing', g:'Main', groups:[
      { n:'Activation', rows:[
        { t:'toggle', k:'aim',       ck:'Enabled',         l:'Enabled',       v:true },
        { t:'key',    k:'aimkey',    ck:'Keybind',         l:'Keybind',       v:'Q'  },
        { t:'seg',    k:'aimmode',   ck:'KeybindMode',     l:'Keybind mode',  o:['Toggle','Hold'], v:'Toggle' },
        { t:'key',    k:'webkey',    ck:'WebviewKeybind',  l:'Webview keybind', v:'F8' }
      ]},
      { n:'Targeting', rows:[
        { t:'select', k:'part',      ck:'FixedPart',       l:'Fixed part',    o:PARTS, v:'Head' },
        { t:'toggle', k:'closest',   ck:'ClosestPoint',    l:'Closest point', v:true },
        { t:'toggle', k:'studchk',   ck:'MaxStudsCheck',   l:'Max studs check', v:true },
        { t:'slider', k:'studs',     ck:'MaxStuds',        l:'Max studs',     min:50, max:2000, step:10, v:500, f:int },
        { t:'toggle', k:'sticky',    ck:'StickyMode',      l:'Sticky mode',   v:true }
      ]},
      { n:'Prediction', rows:[
        { t:'toggle', k:'predict',   ck:'PredictTarget',   l:'Predict target', v:true },
        { t:'slider', k:'px',        ck:'PredictionX',     l:'Prediction X',  min:0, max:0.5, step:0.01, v:0.10, f:two },
        { t:'slider', k:'py',        ck:'PredictionY',     l:'Prediction Y',  min:0, max:0.5, step:0.01, v:0.10, f:two }
      ]},
      { n:'Smoothing', rows:[
        { t:'slider', k:'smooth',    ck:'Smoothness',      l:'Smoothness',    min:0, max:1, step:0.01, v:0.35, f:two },
        { t:'slider', k:'dead',      ck:'StabilizerDeadzone', l:'Stabilizer deadzone', min:0, max:10, step:0.1, v:3.0, f:one },
        { t:'slider', k:'react',     ck:'ReactionDelay',   l:'Reaction delay', min:0, max:1, step:0.01, v:0.12, f:sec },
        { t:'button', k:'bezier',    l:'Bezier curve',     d:'Adjust the smoothing curve.', b:'Edit curve' }
      ]},
      { n:'Safety', rows:[
        { t:'toggle', k:'unlock',    ck:'UnlockOnDeath',   l:'Unlock on death', v:true },
        { t:'toggle', k:'selfdeath', ck:'SelfDeathCheck',  l:'Self death check', v:true }
      ]}
    ]},
    { id:'triggerbot', name:'Triggerbot', sub:'Activation, radius and delay', g:'Main', groups:[
      { n:'Activation', rows:[
        { t:'toggle', k:'trig',      tb:'Enabled',         l:'Enabled',        v:false },
        { t:'key',    k:'trigkey',   tb:'Keybind',         l:'Keybind',        v:'E'   },
        { t:'seg',    k:'trigmode',  tb:'KeybindMode',     l:'Keybind mode',   o:['Toggle','Hold'], v:'Hold' },
        { t:'toggle', k:'camlock',   tb:'RequireCamlock',  l:'Require camlock', v:true }
      ]},
      { n:'Targeting', rows:[
        { t:'select', k:'tpart',     tb:'AimPart',         l:'Aim part',       o:PARTS, v:'Head' },
        { t:'slider', k:'rad',       tb:'Radius',          l:'Radius',         min:1, max:30, step:0.5, v:12.0, f:one },
        { t:'slider', k:'tdelay',    tb:'Delay',           l:'Delay',          min:0, max:1, step:0.01, v:0.12, f:sec },
        { t:'slider', k:'tgun',      tb:'GunswitchDelay',  l:'Gunswitch delay', min:0, max:2, step:0.01, v:0.0, f:sec },
        { t:'toggle', k:'tstud',     tb:'StudCheck',       l:'Stud check',     v:true },
        { t:'slider', k:'tstuds',    tb:'MaxStuds',        l:'Max studs',      min:50, max:2000, step:10, v:500, f:int }
      ]},
      { n:'Safety', rows:[
        { t:'toggle', k:'tdeath',    tb:'DeathCheck',      l:'Death check',    v:true },
        { t:'toggle', k:'tself',     tb:'SelfDeathCheck',  l:'Self death check', v:true }
      ]},
      { n:'Weapons', rows:[
        { t:'toggle', k:'wspec',     tb:'WeaponSpecific',  l:'Weapon specific', d:'Use separate values per weapon.', v:false, re:true }
      ].concat(WEAPONS.map(function(w, i){
        return { t:'weapon', k:'w'+i, wname:w[0] };
      }))}
    ]},
    { id:'movement', name:'Movement', sub:'Macro sequence', g:'Player', groups:[
      { n:'Macro', rows:[
        { t:'toggle', k:'macro',     m:'Enabled',          l:'Enabled',        v:false },
        { t:'key',    k:'mkey',      m:'Keybind',          l:'Keybind',        v:'F'   },

  function fromBackend(c){
    if (!c || typeof c !== 'object') return;
    function set(k, v){ S[k] = v; }
    set('aim',       c.Enabled !== false);
    set('aimkey',    c.Keybind || 'Q');
    set('aimmode',   (c.KeybindMode || 'toggle').toLowerCase() === 'hold' ? 'Hold' : 'Toggle');
    set('webkey',    c.WebviewKeybind || 'F8');
    set('predict',   c.PredictTarget !== false);
    set('px',        c.PredictionX !== undefined ? c.PredictionX : (c.Prediction !== undefined ? c.Prediction : 0.10));
    set('py',        c.PredictionY !== undefined ? c.PredictionY : (c.Prediction !== undefined ? c.Prediction : 0.10));
    set('closest',   c.ClosestPoint !== undefined ? c.ClosestPoint : (c.ClosestPart !== undefined ? c.ClosestPart : true));
    set('part',      c.FixedPart || 'Head');
    set('smooth',    c.Smoothness !== undefined ? c.Smoothness : 0.35);
    set('studchk',   c.MaxStudsCheck !== false);
    set('studs',     c.MaxStuds !== undefined ? c.MaxStuds : 500);
    set('unlock',    c.UnlockOnDeath !== false);
    set('selfdeath', c.SelfDeathCheck !== false);
    set('sticky',    c.StickyMode !== false);
    set('dead',      c.StabilizerDeadzone !== undefined ? c.StabilizerDeadzone : 3.0);
    set('react',     c.ReactionDelay !== undefined ? c.ReactionDelay : 0.12);
    set('stream',    c.Streamproof === true);
    if (c.CurveP1) curveState.p1 = { x: c.CurveP1.x, y: c.CurveP1.y };
    if (c.CurveP2) curveState.p2 = { x: c.CurveP2.x, y: c.CurveP2.y };

    var tb = c.triggerbot || {};
    set('trig',    tb.Enabled === true);
    set('trigkey', tb.Keybind || 'E');
    set('trigmode',(tb.KeybindMode || 'hold').toLowerCase() === 'toggle' ? 'Toggle' : 'Hold');
    set('camlock', tb.RequireCamlock !== false);
    set('tpart',   tb.AimPart || 'Head');
    set('rad',     tb.Radius !== undefined ? tb.Radius : 12.0);
    set('tdelay',  tb.Delay !== undefined ? tb.Delay : 0.12);
    set('tgun',    tb.GunswitchDelay !== undefined ? tb.GunswitchDelay : 0.0);
    set('tstud',   tb.StudCheck !== false);
    set('tstuds',  tb.MaxStuds !== undefined ? tb.MaxStuds : 500);
    set('tdeath',  tb.DeathCheck !== false);
    set('tself',   tb.SelfDeathCheck !== false);
    set('wspec',   tb.WeaponSpecific === true);
    if (tb.WeaponConfigs && typeof tb.WeaponConfigs === 'object') {
      weaponConfigs = {};
      for (var w in tb.WeaponConfigs) weaponConfigs[w] = tb.WeaponConfigs[w];
      WEAPONS.forEach(function(w){ if (!weaponConfigs[w[0]]) weaponConfigs[w[0]] = Object.assign({}, w[1]); });
    }

    var mc = c.macro || {};
    set('macro',  mc.Enabled === true);
    set('mkey',   mc.Keybind || 'F');
    set('mmode',  (mc.KeybindMode || 'toggle').toLowerCase() === 'hold' ? 'Hold' : 'Toggle');
    set('mout',   (mc.OutputMode || 'keyboard').toLowerCase() === 'mouse' ? 'Mouse' : 'Keyboard');
    set('mdelay', mc.Delay !== undefined ? mc.Delay : 0.05);
    set('mself',  mc.SelfDeathCheck !== false);

    var bg = c.UIBackground || { Enabled: false, URL: '' };
    set('uibg',    bg.Enabled === true);
    set('uibgurl', bg.URL || '');
    applyUIBackground();
  }

  async function saveConfig(){
    try {
      var r = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(toBackend())
      });
      if (r.ok) {
        isDirty = false;
        stateEl.classList.remove('busy'); stt.textContent = 'Saved';
        setTimeout(function(){ if (!isDirty) stt.textContent = 'Saved'; }, 800);
      } else {
        stateEl.classList.remove('busy'); stt.textContent = 'Save failed';
      }
    } catch (e) {
      stateEl.classList.remove('busy'); stt.textContent = 'Save error';
    }
  }

  async function loadConfig(){
    try {
      var r = await fetch('/api/config', { credentials: 'include' });
      if (!r.ok) return;
      var cfg = await r.json();
      if (cfg && Object.keys(cfg).length) fromBackend(cfg);
      render();
    } catch (e) { /* ignore */ }
  }

  function applyUIBackground(){
    if (!S.uibg || !S.uibgurl) {
      document.body.classList.remove('ui-bg');
      document.body.style.backgroundImage = '';
      return;
    }
    document.body.style.backgroundImage = 'url("' + String(S.uibgurl).replace(/"/g, '\\"') + '")';
    document.body.classList.add('ui-bg');
  }

  // ============================================================
  // Row rendering
  // ============================================================
  function control(r){
    if (r.t === 'key') {
      var kb = el('button', 'btn keybtn', S[r.k] || '');
      kb.setAttribute('aria-label', r.l + ' (click to change)');
      kb.onclick = function(e){
        e.stopPropagation();
        kb.textContent = 'Press a key…'; kb.classList.add('cap');
        function done(ev){
          ev.preventDefault(); ev.stopPropagation();
          if (ev.key !== 'Escape') {
            var map = {' ':'Space', Control:'Ctrl', Escape:'Esc'};
            var k = ev.key;
            S[r.k] = map[k] || (k.length === 1 ? k.toUpperCase() : k);
            if (r.k === 'aimkey') kb.textContent = S[r.k];
            else if (r.k === 'trigkey') kb.textContent = S[r.k];
            else kb.textContent = S[r.k];
            saved();
          }
          kb.classList.remove('cap');
          if (!S[r.k]) kb.textContent = r.v;
          document.removeEventListener('keydown', done, true);
        }
        document.addEventListener('keydown', done, true);
      };
      return kb;
    }
    if (r.t === 'toggle') {
      var b = el('button', 'sw');
      b.setAttribute('role','switch');
      b.setAttribute('aria-label', r.l);
      b.setAttribute('aria-checked', S[r.k] ? 'true' : 'false');
      b.onclick = function(){
        S[r.k] = !S[r.k];
        b.setAttribute('aria-checked', S[r.k] ? 'true' : 'false');
        if (r.k === 'uibg') applyUIBackground();
        if (r.k === 'wspec') { renderKeep(); }
        saved();
      };
      return b;
    }
    if (r.t === 'select') {
      var w = el('div','dd'), lab = el('span','', S[r.k]), btn = el('button','dd-btn'), m = el('div','dd-menu');
      btn.appendChild(lab);
      btn.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>');
      btn.setAttribute('aria-haspopup','listbox');
      btn.setAttribute('aria-expanded','false');
      btn.setAttribute('aria-label', r.l);
      m.hidden = true; m.setAttribute('role','listbox');
      r.o.forEach(function(o){
        var i = el('button','', o);
        i.setAttribute('role','option');
        i.setAttribute('aria-selected', o === S[r.k] ? 'true' : 'false');
        i.onclick = function(e){
          e.stopPropagation();
          S[r.k] = o; lab.textContent = o; m.hidden = true; btn.setAttribute('aria-expanded','false');
          [].forEach.call(m.children, function(x){ x.setAttribute('aria-selected', x === i ? 'true' : 'false'); });
          saved();
        };
        m.appendChild(i);
      });
      btn.onclick = function(e){
        e.stopPropagation();
        var open = m.hidden;
        closeMenus(m);
        m.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      w.appendChild(btn); w.appendChild(m);
      return w;
    }
    if (r.t === 'slider') {
      var s = el('div','sl'), inp = el('input'), v = el('span','mono');
      inp.type = 'range'; inp.min = r.min; inp.max = r.max; inp.step = r.step;
      inp.value = S[r.k]; inp.setAttribute('aria-label', r.l);
      var paint = function(){
        inp.style.setProperty('--p', ((inp.value - r.min) / (r.max - r.min) * 100) + '%');
        v.textContent = r.f(+inp.value);
      };
      inp.oninput = function(){ S[r.k] = +inp.value; paint(); };
      inp.onchange = function(){ saved(); };
      paint();
      s.appendChild(inp); s.appendChild(v);
      return s;
    }
    if (r.t === 'seg') {
      var g = el('div','seg');
      g.setAttribute('role','radiogroup');
      g.setAttribute('aria-label', r.l);
      r.o.forEach(function(o){
        var bb = el('button','', o);
        bb.setAttribute('role','radio');
        bb.setAttribute('aria-checked', o === S[r.k] ? 'true' : 'false');
        bb.onclick = function(){
          S[r.k] = o;
          [].forEach.call(g.children, function(x){ x.setAttribute('aria-checked', x === bb ? 'true' : 'false'); });
          saved();
        };
        g.appendChild(bb);
      });
      return g;
    }
    if (r.t === 'url') {
      var u = el('input');
      u.type = 'text';
      u.value = S[r.k] || '';
      u.placeholder = 'https://example.com/image.png';
      u.style.minWidth = '280px';
      u.style.padding = '7px 10px';
      u.style.border = '0';
      u.style.borderRadius = '8px';
      u.style.background = 'rgba(255,255,255,.08)';
      u.style.outline = '0';
      u.oninput = function(){ S[r.k] = u.value; };
      u.onchange = function(){ applyUIBackground(); saved(); };
      return u;
    }
    if (r.t === 'button') {
      var bt = el('button', 'btn' + (r.danger ? ' danger' : ''), r.b);
      bt.onclick = function(){
        if (r.k === 'destruct') {
          if (!bt.dataset.arm) {
            bt.dataset.arm = '1';
            bt.textContent = 'Click again to confirm';
            setTimeout(function(){ if (bt.dataset.arm){ delete bt.dataset.arm; bt.textContent = r.b; } }, 3000);
            return;
          }
          signOut();
          return;
        }
        if (r.k === 'bezier') { openBezier(); return; }
        if (r.k === 'publish') { openPublish(); return; }
        saved();
      };
      return bt;
    }
    if (r.t === 'info') {
      return el('span','mono', S['__'+r.key] || '—');
    }
    if (r.t === 'weapon') {
      return el('span','mono', r.wname);
    }
    if (r.t === 'community') {
      var c = el('div','cards'); c.id = 'communityGrid';
      c.style.flex = '1';
      c.style.minWidth = '260px';
      return c;

    return el('span','mono', r.val || '');

  function rowEl(r){

      var wname = r.wname;
      var wcfg = weaponConfigs[wname] || {};

      var ddV = el('span','mono', sec(wcfg.Delay || 0.08));
      ddIn.oninput = function(){ var val = +ddIn.value; ddV.textContent = sec(val); wcfg.Delay = val; };
      ddIn.onchange = function(){ weaponConfigs[wname] = wcfg; saved(); };
      ddSl.appendChild(ddIn); ddSl.appendChild(ddV);

    var t = el('div','txt');

  // ============================================================
  // Search and render
  // ============================================================
  function renderKeep(){
    var y = content.scrollTop;
    render();
    content.scrollTop = y;
  }

  function render(){
    content.innerHTML = '';
    var query = (q.value || '').trim().toLowerCase();
    if (query) {
      var n = 0;
      CFG.forEach(function(p){
        p.groups.forEach(function(g){
          if (g.when && !S[g.when]) return;
          var hits = g.rows.filter(function(r){ return ((r.l || '') + ' ' + (r.d || '')).toLowerCase().indexOf(query) > -1; });
          if (!hits.length) return;
          if (!n) {
            var ph = el('div','ph','<b>Results</b><span></span>');
            content.appendChild(ph);
          }
          n += hits.length;
          var grp = el('div','grp'); var h = el('h3'); h.textContent = p.name + ' · ' + g.n; grp.appendChild(h);
          var pan = el('div','panel');
          hits.forEach(function(r){ pan.appendChild(rowEl(r)); });
          grp.appendChild(pan); content.appendChild(grp);
        });
      });
      if (!n) content.appendChild(el('div','empty','Nothing matches "' + (q.value||'').replace(/</g,'&lt;') + '"'));
      else content.querySelector('.ph span').textContent = n + (n === 1 ? ' setting' : ' settings');
      [].forEach.call(nav.querySelectorAll('button'), function(b){ b.setAttribute('aria-selected','false'); });
      return;
    }
    var p = CFG.filter(function(x){ return x.id === cur; })[0];
    content.appendChild(el('div','ph','<b>' + p.name + '</b><span>' + p.sub + '</span>'));
    p.groups.forEach(function(g){
      if (g.when && !S[g.when]) return;
      var grp = el('div','grp'); var h = el('h3'); h.textContent = g.n; grp.appendChild(h);
      var pan = el('div','panel');
      g.rows.forEach(function(r){ pan.appendChild(rowEl(r)); });
      grp.appendChild(pan); content.appendChild(grp);
    });
    // Fill in info rows for the Account page
    if (cur === 'account') {
      S['__username'] = S['__username'] || '—';
      S['__session']  = S['__session']  || '—';
      S['__hwid']     = S['__hwid']     || '—';
      S['__client']   = S['__client']   || '—';
      [].forEach.call(content.querySelectorAll('.mono'), function(m, i){ /* noop */ });
    }
    // Render community grid if on that page
    if (cur === 'community') loadCommunity();
    [].forEach.call(nav.querySelectorAll('button'), function(b){ b.setAttribute('aria-selected', b.dataset.id === cur ? 'true' : 'false'); });
    content.scrollTop = 0;
  }

  // Nav
  var lastG = '';
  CFG.forEach(function(p, i){
    if (p.g !== lastG) {
      nav.appendChild(el('small','', p.g));
      lastG = p.g;
    }
    var b = el('button','','<span>' + p.name + '</span><i>' + (i + 1) + '</i>');
    b.dataset.id = p.id;
    b.setAttribute('role','tab');
    b.onclick = function(){ cur = p.id; q.value = ''; render(); };
    nav.appendChild(b);
  });

  q.addEventListener('input', render);
  document.addEventListener('click', function(){ closeMenus(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      closeMenus();
      if (document.activeElement === q) { q.value = ''; q.blur(); render(); }
      return;
    }
    var typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'range';
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); q.focus(); return; }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= CFG.length) { cur = CFG[n-1].id; q.value = ''; render(); }
  });

  var currentUser = null;
  async function refreshSession(){
    try {
      var r = await fetch('/api/me', { credentials: 'include' });
      var d = await r.json();
      if (!d.authenticated) { window.location.href = '/'; return; }
      currentUser = d.username || 'user';
      S['__username'] = currentUser;
      S['__session']  = 'Authenticated';
      try {
        var dr = await fetch('/api/dashboard', { credentials: 'include' });
        if (dr.ok) {
          var dd = await dr.json();
          S['__hwid'] = dd.hwid || 'not bound';
        }
      } catch (e) {}
      refreshClientStatus();
      setInterval(refreshClientStatus, 3000);
    } catch (e) {
      S['__username'] = '—';
      S['__session']  = 'unable to verify';
    }
  }

  async function refreshClientStatus(){
    if (!currentUser) return;
    try {
      var r = await fetch('/api/client/status-by-user/' + encodeURIComponent(currentUser), { credentials: 'include' });
      if (!r.ok) return;
      var d = await r.json();
      S['__client'] = d.connected ? 'Connected' : 'Offline';
      if (cur === 'account') {
        var els = content.querySelectorAll('.mono');
        // update only the client row (last one)
        els.forEach(function(m){});
      }
    } catch (e) {}
  }

  function tickTimer(){
    var s = Math.floor((Date.now() - sessionStart) / 1000);
    var hh = String(Math.floor(s / 3600)).padStart(2,'0');
    var mm = String(Math.floor((s % 3600) / 60)).padStart(2,'0');
    var ss = String(s % 60).padStart(2,'0');
    $('sessionBar').textContent = hh + ':' + mm + ':' + ss;
  }
  setInterval(tickTimer, 1000); tickTimer();

  // ============================================================
  // Sign out / destruct
  // ============================================================
  function signOut(){
    var overlay = el('div','gone','<b>Session closed</b><span>Signing you out…</span>');
    document.body.appendChild(overlay);
    fetch('/api/logout', { method: 'POST', credentials: 'include' }).catch(function(){});
    fetch('/api/client/shutdown', { method: 'POST', credentials: 'include' }).catch(function(){});
    setTimeout(function(){ window.location.href = '/'; }, 600);
  }
  $('signOutBtn').onclick = signOut;
  $('closeBtn').onclick = signOut;

  // ============================================================
  // Bezier curve editor
  // ============================================================
  var bezBounds = { left:34, right:582, top:18, bottom:278 };
  var bezSvg = $('bezierSvg');
  var bezPath = $('cpath'), bezH1 = $('hline1'), bezH2 = $('hline2');
  var bezC1 = $('cp1'), bezC2 = $('cp2');
  var bezDrag = null;
  function bezClamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function bezDraw(){
    var p1 = curveState.p1, p2 = curveState.p2;
    bezPath.setAttribute('d','M ' + bezBounds.left + ' ' + bezBounds.bottom +
      ' C ' + p1.x + ' ' + p1.y + ' ' + p2.x + ' ' + p2.y + ' ' + bezBounds.right + ' ' + bezBounds.top);
    bezH1.setAttribute('d','M ' + bezBounds.left + ' ' + bezBounds.bottom + ' L ' + p1.x + ' ' + p1.y);
    bezH2.setAttribute('d','M ' + p2.x + ' ' + p2.y + ' L ' + bezBounds.right + ' ' + bezBounds.top);
    bezC1.setAttribute('cx', p1.x); bezC1.setAttribute('cy', p1.y);
    bezC2.setAttribute('cx', p2.x); bezC2.setAttribute('cy', p2.y);
    $('pv1').textContent = Math.round((p1.x - 34) / 548 * 100) + '%, ' + Math.round((278 - p1.y) / 260 * 100) + '%';
    $('pv2').textContent = Math.round((p2.x - 34) / 548 * 100) + '%, ' + Math.round((278 - p2.y) / 260 * 100) + '%';
  }
  function bezFromEvent(ev){
    var pt = bezSvg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    var m = bezSvg.getScreenCTM(); if (!m) return null;
    var l = pt.matrixTransform(m.inverse());
    return { x: bezClamp(l.x, bezBounds.left, bezBounds.right), y: bezClamp(l.y, bezBounds.top, bezBounds.bottom) };
  }
  bezSvg.addEventListener('pointermove', function(ev){
    if (!bezDrag) return;
    var p = bezFromEvent(ev); if (!p) return;
    curveState[bezDrag] = p; bezDraw();
  });
  bezSvg.addEventListener('pointerup', function(){ if (bezDrag){ bezDrag = null; saved(); } });
  bezSvg.addEventListener('pointercancel', function(){ bezDrag = null; });
  [bezC1, bezC2].forEach(function(c){
    c.addEventListener('pointerdown', function(ev){
      bezDrag = c.dataset.pt === '1' ? 'p1' : 'p2';
      c.setPointerCapture && c.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
  });
  function openBezier(){ bezDraw(); $('bezierModal').classList.add('show'); }
  $('bezierClose').onclick = function(){ $('bezierModal').classList.remove('show'); };
  $('bezierReset').onclick = function(){ curveState.p1 = {x:180,y:200}; curveState.p2 = {x:420,y:80}; bezDraw(); saved(); };

  // ============================================================
  // Community — list, publish, like, load, save-mine
  // ============================================================
  var communityConfigs = [], myLikes = new Set();
  async function loadCommunity(){
    var grid = document.getElementById('communityGrid');
    if (!grid) return;
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Loading…</div>';
    try {
      var r = await fetch('/api/community/configs', { credentials: 'include' });
      if (!r.ok) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Failed to load.</div>'; return; }
      var d = await r.json();
      communityConfigs = d.configs || [];
      myLikes = new Set(d.liked_ids || []);
      renderCommunity();
    } catch (e) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Connection error.</div>';
    }
  }
  function renderCommunity(){
    var grid = document.getElementById('communityGrid');
    if (!grid) return;
    if (!communityConfigs.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No configs yet. Click "Publish config" above.</div>';
      return;
    }
    grid.innerHTML = '';
    communityConfigs.forEach(function(c){
      var card = el('div','card');
      var liked = myLikes.has(c.id);
      card.innerHTML =
        '<h4>' + esc(c.name) + '</h4>' +
        '<div class="meta">by ' + esc(c.author || 'unknown') + ' · ' + when(c.created_at) + '</div>' +
        '<div class="desc">' + esc(c.description || 'No description.') + '</div>' +
        '<div class="foot">' +
          '<button class="like ' + (liked ? 'on' : '') + '"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' + (c.likes || 0) + '</button>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="mini" data-save>Save mine</button>' +
            '<button class="mini primary" data-load>Load</button>' +
          '</div>' +
        '</div>';
      card.querySelector('.like').onclick = function(){ toggleLike(c.id); };
      card.querySelector('[data-save]').onclick = function(){ saveCommunityMine(c.id); };
      card.querySelector('[data-load]').onclick = function(){ loadCommunityIntoUI(c); };
      grid.appendChild(card);
    });
  }
  async function toggleLike(id){
    try {
      var r = await fetch('/api/community/configs/' + id + '/like', { method: 'POST', credentials: 'include' });
      if (!r.ok) { toast("Couldn't like"); return; }
      var d = await r.json();
      var cfg = communityConfigs.find(function(c){ return c.id === id; });
      if (cfg) cfg.likes = d.likes;
      if (d.liked) myLikes.add(id); else myLikes.delete(id);
      renderCommunity();
    } catch (e) { toast('Connection error'); }
  }
  function loadCommunityIntoUI(c){
    fromBackend(c.config_data || {});
    renderKeep();
    saved();
    toast('Config loaded');
  }
  async function saveCommunityMine(id){
    try {
      var r = await fetch('/api/community/configs/save-mine', {
        method:'POST', headers:{'Content-Type':'application/json'},
        credentials:'include',
        body: JSON.stringify({ community_config_id: id })
      });
      if (r.ok) toast('Added to your configs');
      else toast('Save failed');
    } catch (e) { toast('Connection error'); }
  }
  function openPublish(){ $('pubName').value = ''; $('pubDesc').value = ''; $('publishModal').classList.add('show'); }
  $('pubCancel').onclick = function(){ $('publishModal').classList.remove('show'); };
  $('publishModal').addEventListener('click', function(e){ if (e.target === $('publishModal')) $('publishModal').classList.remove('show'); });
  $('pubConfirm').onclick = async function(){
    var name = $('pubName').value.trim();
    var desc = $('pubDesc').value.trim();
    if (!name) { toast('Name required'); return; }
    try {
      var r = await fetch('/api/community/configs', {
        method:'POST', headers:{'Content-Type':'application/json'},
        credentials:'include',
        body: JSON.stringify({ name: name, description: desc, config_data: toBackend() })
      });
      if (r.ok) {
        toast('Published!');
        $('publishModal').classList.remove('show');
        await loadCommunity();
      } else {
        var err = await r.json().catch(function(){ return {}; });
        toast(err.detail || 'Publish failed');
      }
    } catch (e) { toast('Connection error'); }
  };

  function esc(s){ return String(s).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
  function when(iso){
    if (!iso) return 'recently';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return 'recently';
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString();
  }

  // ============================================================
  // Boot
  // ============================================================
  (async function boot(){
    await refreshSession();
    await loadConfig();
    applyUIBackground();
    render();
  })();
})();
</script>
