<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--text:#F2F3F5;--muted:#A9AFB8;--dim:#7B828C;--hair:rgba(255,255,255,.06);--panel:rgba(255,255,255,.045);--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#0e1218;color:var(--text);font:400 13px/1.45 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:stretch;padding:0;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.scene{position:fixed;inset:0;z-index:0;background:#0e1218 url("https://cdn.corenexis.com/f/0yjd54ZW.webp") center/cover no-repeat}
.scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}

.win{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:44px 1fr;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.025)),rgba(9,14,12,.7);
  backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%)}
.title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 20px;-webkit-app-region:drag;app-region:drag}
.brand{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);transition:color .2s}
.state svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.state.busy{color:var(--text)}
.wc{display:flex;gap:2px;justify-self:end;-webkit-app-region:no-drag;app-region:no-drag}
.wc button{width:36px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:13px}
.wc button:hover{background:rgba(255,255,255,.1);color:#fff}

.body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}

.side{display:flex;flex-direction:column;padding:6px 12px 14px 14px;min-height:0}
.search{position:relative;margin-bottom:16px}
.search svg{position:absolute;left:11px;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:36px;padding:0 34px 0 33px;border:0;border-radius:10px;background:rgba(255,255,255,.07);outline:0;transition:background .15s}
.search input::placeholder{color:var(--dim)}
.search input:focus{background:rgba(255,255,255,.12)}
.search kbd{position:absolute;right:9px;top:50%;margin-top:-9px;height:18px;min-width:18px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--dim);font:500 10.5px/18px var(--mono);text-align:center}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav small{padding:12px 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.nav small:first-child{padding-top:0}
.nav button{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:500;text-align:left;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.nav button i{font:500 10.5px var(--mono);font-style:normal;color:var(--dim)}
.ver{margin-top:auto;padding:0 10px;font:400 11px var(--mono);color:var(--dim)}

.content>*{max-width:920px}
.content{overflow-y:auto;padding:6px 48px 110px 24px;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.ph{display:flex;align-items:baseline;gap:12px;height:36px;margin-bottom:2px}
.ph b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ph span{color:var(--dim);font-size:12.5px}
.grp{margin-top:18px}
.grp h3{margin:0 0 8px 2px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.panel{padding:0 16px;border-radius:12px;background:var(--panel)}
.row{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:52px;padding:9px 0}
.row+.row{border-top:1px solid var(--hair)}
.txt{min-width:0}
.txt b{display:block;font-size:13.5px;font-weight:500}
.txt span{display:block;margin-top:1px;font-size:12px;color:var(--dim)}
.mono{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:40px 0;text-align:center;color:var(--dim)}

.gone{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:rgba(12,12,14,.88)}
.gone b{font-size:16px;font-weight:600}
.gone span{color:var(--muted);margin-bottom:12px}

/* session time: text only */
.session{position:fixed;right:18px;bottom:14px;z-index:5;font:500 11px var(--mono);color:var(--dim);pointer-events:none}

.sw{position:relative;flex:none;width:36px;height:21px;padding:0;border:0;border-radius:11px;background:rgba(255,255,255,.16);transition:background .18s}
.sw::after{content:"";position:absolute;left:2.5px;top:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s,background .18s}
.sw[aria-checked="true"]{background:#fff}
.sw[aria-checked="true"]::after{transform:translateX(15px);background:#10151a}

.dd{position:relative;flex:none}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:150px;height:32px;padding:0 10px 0 12px;border:0;border-radius:8px;background:rgba(255,255,255,.08);font-weight:500;transition:background .12s}
.dd-btn:hover,.dd-btn[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.dd-btn svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dd-menu{position:absolute;right:0;top:38px;z-index:10;min-width:100%;padding:4px;border-radius:10px;background:rgba(11,16,14,.98);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.07)}
.dd-menu[hidden]{display:none}
.dd-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:30px;padding:0 9px;border:0;border-radius:6px;background:none;text-align:left;white-space:nowrap}
.dd-menu button:hover{background:rgba(255,255,255,.09)}
.dd-menu button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.12)}

.sl{display:flex;align-items:center;gap:14px;width:290px;flex:none}
.sl .mono{width:78px;text-align:right}
input[type=range]{flex:1;min-width:0;height:20px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.18) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,255,255,0);transition:box-shadow .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,255,255,.16)}

.seg{display:flex;flex:none;padding:2px;border-radius:9px;background:rgba(255,255,255,.08)}
.seg button{height:28px;min-width:44px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:500;transition:background .12s,color .12s}
.seg button:hover{color:#fff}
.seg button[aria-checked="true"]{background:#fff;color:#10151a}

.btn{height:32px;padding:0 14px;border:0;border-radius:8px;background:rgba(255,255,255,.09);font-weight:500;transition:background .12s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:#fff;color:#10151a;font-weight:600}
.btn.primary:hover{background:#e6e8ec}
.keybtn{min-width:64px;font:500 12px var(--mono)}
.keybtn.cap{background:#fff;color:#10151a}
.btn:disabled{opacity:.5;pointer-events:none}

.card{flex:1;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04)}
.card h4{margin:0 0 4px;font-size:13px;font-weight:600}

/* ==== curve editor ==== */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(600px,94vw);max-height:92vh;overflow:auto;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),rgba(12,17,15,.94);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(8px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.overlay.show .modal{transform:none}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mh h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.mh p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.mx{width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted);font-size:13px}
.mx:hover{background:rgba(255,255,255,.14);color:#fff}
.bez{padding:12px 12px 6px;border-radius:12px;background:var(--panel)}
.bez svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.bez .base{stroke:rgba(255,255,255,.1);stroke-width:1}
.bez .ref{stroke:rgba(255,255,255,.14);stroke-width:1;stroke-dasharray:2 5}
.bez .fill{fill:rgba(255,255,255,.055)}
.bez .curve{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.bez .arm{stroke:rgba(255,255,255,.3);stroke-width:1}
.bez .end{fill:#fff}
.bez .ring{fill:rgba(255,255,255,.14);opacity:0;transition:opacity .15s}
.bez .h{cursor:grab}
.bez .h:hover .ring,.bez .h.drag .ring{opacity:1}
.bez .h.drag{cursor:grabbing}
.bez .knob{fill:#fff}
.bez text{fill:var(--dim);font:500 10px var(--mono)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mrow .seg button{min-width:0;padding:0 11px}
.reads{display:flex;gap:6px}
.reads span{padding:5px 10px;border-radius:8px;background:var(--panel);font:500 11.5px var(--mono);color:var(--muted)}
.reads b{color:var(--text);font-weight:500}
.rail{position:relative;height:46px;border-radius:12px;background:var(--panel)}
.rail::before{content:"";position:absolute;left:24px;right:24px;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:rgba(255,255,255,.12)}
.rail i{position:absolute;left:8px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:#cfd3d8 url("https://cdn.pfps.gg/pfps/7772-475932-sad-bart-simpson.png") center/cover}
.rail small{position:absolute;right:12px;top:-18px;font:500 10px var(--mono);color:var(--dim);letter-spacing:.04em}
.mact{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:760px){
  body{overflow:auto}
  .win{height:auto;min-height:100dvh}
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{padding:0 14px 6px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav small,.nav button i,.ver{display:none}
  .nav button{flex:none;padding:0 12px}
  .content{padding:4px 16px 90px}
  .row{flex-wrap:wrap;gap:10px}
  .sl{width:100%}
  .title{grid-template-columns:auto 1fr auto}
  .state{justify-content:center}
}
</style>
</head>
<body>
<div class="scene" role="presentation"></div>

<div class="win" id="win">
  <div class="title">
    <span class="brand">Light</span>
    <span class="state" id="state"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span id="stt">Saved</span></span>
    <div class="wc"><button aria-label="Close" id="closeBtn">✕</button></div>
  </div>

  <div class="body">
    <aside class="side">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="text" placeholder="Search settings" aria-label="Search settings" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <nav class="nav" id="nav" role="tablist" aria-label="Settings sections"></nav>
      <div class="ver">v2.8.1 · stable</div>
    </aside>
    <main class="content" id="content" role="tabpanel"></main>
  </div>
</div>

<div class="session" id="sessionBar">00:00:00</div>

<div class="overlay" id="bezierModal">
  <div class="modal" role="dialog" aria-label="Smoothing curve">
    <div class="mh">
      <div><h3>Smoothing curve</h3><p>Drag the dots to change how your aim speeds up and slows down.</p></div>
      <button class="mx" id="bezierX" aria-label="Close">✕</button>
    </div>

    <div class="bez">
      <svg id="bezSvg" viewBox="0 0 560 262" preserveAspectRatio="xMidYMid meet">
        <path class="base" d="M20 240H540"/>
        <path class="ref" d="M20 240L540 20"/>
        <path id="bFill" class="fill"/>
        <path id="bArm1" class="arm"/>
        <path id="bArm2" class="arm"/>
        <path id="bCurve" class="curve"/>
        <circle class="end" cx="20" cy="240" r="4"/>
        <circle class="end" cx="540" cy="20" r="4"/>
        <g class="h" id="bH1"><circle class="ring" r="17"/><circle class="knob" r="7"/></g>
        <g class="h" id="bH2"><circle class="ring" r="17"/><circle class="knob" r="7"/></g>
        <text x="540" y="257" text-anchor="end">TIME</text>
        <text x="20" y="11">SPEED</text>
      </svg>
    </div>

    <div class="mrow">
      <div class="seg" id="bPresets" role="radiogroup" aria-label="Curve presets"></div>
      <div class="reads"><span>P1 <b id="r1">0.27, 0.30</b></span><span>P2 <b id="r2">0.70, 0.76</b></span></div>
    </div>

    <div class="rail" aria-hidden="true"><small>PREVIEW</small><i id="bDot"></i></div>

    <div class="mact">
      <button class="btn" id="bezierReset">Reset</button>
      <button class="btn primary" id="bezierDone">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

  // ============================================================
  // Config schema
  // ============================================================
  var PARTS = ['Head','UpperTorso','LowerTorso','HumanoidRootPart'];
  var WEAPONS = [
    ['Double-Barrel SG', {AimPart:'Head', Radius:12.0, Delay:0.08}],
    ['Revolver',         {AimPart:'Head', Radius:10.0, Delay:0.15}],
    ['TacticalShotgun',  {AimPart:'Head', Radius:14.0, Delay:0.10}]
  ];
  var sec = function(x){ return (+x).toFixed(2) + ' s'; };
  var two = function(x){ return (+x).toFixed(2); };
  var one = function(x){ return (+x).toFixed(1); };
  var int = function(x){ return String(Math.round(+x)); };

  var CFG = [
    { id:'aimassist', name:'Aimassist', sub:'How it picks and follows a target', g:'Main', groups:[
      { n:'Activation', rows:[
        { t:'toggle', k:'aim',     l:'Enabled',      v:true },
        { t:'key',    k:'aimkey',  l:'Keybind',      v:'Q' },
        { t:'seg',    k:'aimmode', l:'Keybind mode', o:['Toggle','Hold'], v:'Toggle' }
      ]},
      { n:'Targeting', rows:[
        { t:'select', k:'part',    l:'Fixed part',      o:PARTS, v:'Head' },
        { t:'toggle', k:'closest', l:'Closest point',   v:true },
        { t:'toggle', k:'studchk', l:'Max studs check', v:true },
        { t:'slider', k:'studs',   l:'Max studs',       min:50, max:2000, step:10, v:500, f:int },
        { t:'toggle', k:'sticky',  l:'Sticky mode',     v:true }
      ]},
      { n:'Prediction', rows:[
        { t:'toggle', k:'predict', l:'Predict target', v:true },
        { t:'slider', k:'px',      l:'Prediction X',   min:0, max:0.5, step:0.01, v:0.10, f:two },
        { t:'slider', k:'py',      l:'Prediction Y',   min:0, max:0.5, step:0.01, v:0.10, f:two }
      ]},
      { n:'Smoothing', rows:[
        { t:'slider', k:'smooth', l:'Smoothness',          min:0, max:1, step:0.01, v:0.35, f:two },
        { t:'slider', k:'dead',   l:'Stabilizer deadzone', min:0, max:10, step:0.1, v:3.0, f:one },
        { t:'slider', k:'react',  l:'Reaction delay',      min:0, max:1, step:0.01, v:0.12, f:sec },
        { t:'button', k:'bezier', l:'Smoothing curve', b:'Edit curve' }
      ]},
      { n:'Safety', rows:[
        { t:'toggle', k:'unlock',    l:'Unlock on death',  v:true },
        { t:'toggle', k:'selfdeath', l:'Self death check', v:true }
      ]}
    ]},
    { id:'triggerbot', name:'Triggerbot', sub:'When and how it fires', g:'Main', groups:[
      { n:'Activation', rows:[
        { t:'toggle', k:'trig',     l:'Enabled',         v:false },
        { t:'key',    k:'trigkey',  l:'Keybind',         v:'E' },
        { t:'seg',    k:'trigmode', l:'Keybind mode',    o:['Toggle','Hold'], v:'Hold' },
        { t:'toggle', k:'camlock',  l:'Require camlock', v:true }
      ]},
      { n:'Targeting', rows:[
        { t:'select', k:'tpart',  l:'Aim part',        o:PARTS, v:'Head' },
        { t:'slider', k:'rad',    l:'Radius',          min:1, max:30, step:0.5, v:12.0, f:one },
        { t:'slider', k:'tdelay', l:'Delay',           min:0, max:1, step:0.01, v:0.12, f:sec },
        { t:'slider', k:'tgun',   l:'Gunswitch delay', min:0, max:2, step:0.01, v:0.0, f:sec },
        { t:'toggle', k:'tstud',  l:'Stud check',      v:true },
        { t:'slider', k:'tstuds', l:'Max studs',       min:50, max:2000, step:10, v:500, f:int }
      ]},
      { n:'Safety', rows:[
        { t:'toggle', k:'tdeath', l:'Death check',      v:true },
        { t:'toggle', k:'tself',  l:'Self death check', v:true }
      ]},
      { n:'Weapons', rows:[
        { t:'toggle', k:'wspec', l:'Weapon specific', d:'Give each weapon its own numbers.', v:false, re:true }
      ].concat(WEAPONS.map(function(w, i){ return { t:'weapon', k:'w'+i, wname:w[0], when:'wspec' }; }))}
    ]},
    { id:'movement', name:'Movement', sub:'Your macro', g:'Player', groups:[
      { n:'Macro', rows:[
        { t:'toggle', k:'macro', l:'Enabled',      v:false },
        { t:'key',    k:'mkey',  l:'Keybind',      v:'F' },
        { t:'seg',    k:'mmode', l:'Keybind mode', o:['Toggle','Hold'], v:'Toggle' },
        { t:'seg',    k:'mout',  l:'Output mode',  o:['Keyboard','Mouse'], v:'Keyboard' }
      ]},
      { n:'Sequence', rows:[
        { t:'slider', k:'mdelay', l:'Delay',            min:0, max:1, step:0.01, v:0.05, f:sec },
        { t:'toggle', k:'mself',  l:'Self death check', v:true }
      ]}
    ]},
    { id:'settings', name:'Settings', sub:'Account, privacy and closing up', g:'Settings', groups:[
      { n:'Account', rows:[
        { t:'info', key:'username', l:'Username' },
        { t:'info', key:'session',  l:'Session' },
        { t:'info', key:'hwid',     l:'HWID' },
        { t:'info', key:'client',   l:'Client' }
      ]},
      { n:'Privacy', rows:[
        { t:'toggle', k:'stream', l:'Stream proof',     d:'Keeps this window out of screen shares and recordings.', v:false },
        { t:'key',    k:'webkey', l:'Webview keybind',  v:'F8' }
      ]},
      { n:'Exit', rows:[
        { t:'button', k:'destruct', l:'Self destruct', d:'Closes the menu and wipes your settings.', b:'Self destruct' }
      ]}
    ]}
  ];

  // ============================================================
  // State
  // ============================================================
  var S = {}, D = {}, weaponConfigs = {}, info = {};
  CFG.forEach(function(p){ p.groups.forEach(function(g){ g.rows.forEach(function(r){ if (r.k && r.v !== undefined) D[r.k] = r.v; }); }); });

  var CURVE_DEFAULT = { p1:{x:0.27,y:0.30}, p2:{x:0.70,y:0.76} };
  var curve = { p1:Object.assign({}, CURVE_DEFAULT.p1), p2:Object.assign({}, CURVE_DEFAULT.p2) };

  function resetState(){
    S = {}; for (var k in D) S[k] = D[k];
    weaponConfigs = {};

  [['bH1','p1'],['bH2','p2']].forEach(function(h){
    var g = $(h[0]);
    g.addEventListener('pointerdown', function(ev){ drag = h[1]; g.classList.add('drag'); g.setPointerCapture(ev.pointerId); ev.preventDefault(); });
    g.addEventListener('pointermove', function(ev){ if (drag !== h[1]) return; var p = pointer(ev); if (p) { curve[drag] = p; draw(); } });
    var end = function(){ if (drag === h[1]) { drag = null; g.classList.remove('drag'); saved(); } };
    g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  });
  function startPreview(){
    var dot = $('bDot'); clearInterval(loop); rev = false;
    var t = dot.style.transition; dot.style.transition = 'none'; dot.style.left = '8px'; void dot.offsetWidth; dot.style.transition = t;
    loop = setInterval(function(){ rev = !rev; dot.style.left = rev ? 'calc(100% - 36px)' : '8px'; }, 1500);
  }
  function openBezier(){ draw(); $('bezierModal').classList.add('show'); startPreview(); }
  function closeBezier(){ $('bezierModal').classList.remove('show'); clearInterval(loop); }
  $('bezierDone').onclick = closeBezier; $('bezierX').onclick = closeBezier;
  $('bezierModal').addEventListener('click', function(e){ if (e.target === $('bezierModal')) closeBezier(); });
  $('bezierReset').onclick = function(){ curve = { p1:Object.assign({}, CURVE_DEFAULT.p1), p2:Object.assign({}, CURVE_DEFAULT.p2) }; draw(); saved(); };

  // ============================================================
  // Boot
  // ============================================================
  (async function boot(){
    await loadAccount();
    await loadConfig();
    render();
  })();
})();
</script>
</body>
