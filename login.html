<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, rgba(6,10,14,0.75), rgba(6,10,14,0.55)),
      url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2000&q=80');
    background-size: cover; background-position: center; background-attachment: fixed;
  }

  #login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-wrap {
    width: 100vw;
    height: 100vh;
    max-width: none;
    border-radius: 0;
    box-shadow: none;
  }

  .panel {
    width: 100%;
    height: 100%;
    display: flex;
    border-radius: 0;
    overflow: hidden;
    background: radial-gradient(120% 140% at 100% 0%, rgba(142,203,255,0.14), transparent 60%), #0a0a0c;
  }

  .panel-left {
    position: relative;
    flex: 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 34px 26px 30px;
  }

  .form-heading {
    color: #f5f5f6;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .form-heading .highlight { color: #8ecbff; }

  .form-sub {
    color: rgba(230,230,232,0.5);
    font-size: 11px;
    margin-bottom: 18px;
  }

  .field-group { width: 100%; margin-bottom: 11px; }

  .field-group label {
    display: block;
    color: rgba(230,230,232,0.55);
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
  }

  .input-shell {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-shell svg {
    position: absolute;
    left: 10px;
    width: 12px;
    height: 12px;
    opacity: 0.4;
  }

  .field-group input {
    width: 100%;
    background: transparent;
    border: 1px solid #1a1a1d;
    border-radius: 8px;
    padding: 8px 11px 8px 28px;
    color: #f2f2f3;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field-group input:focus {
    border-color: #8ecbff;
    box-shadow: 0 0 0 3px rgba(142,203,255,0.12);
  }

  .login-btn {
    position: relative;
    width: 100%;
    margin-top: 8px;
    padding: 9px 0;
    border: none;
    border-radius: 8px;
    background: #ffffff;
    color: #0a0a0d;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
