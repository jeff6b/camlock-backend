<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light Toast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #131316;
    --border: #2a2a2e;
    --text: #F2F3F5;
    --muted: #A9AFB8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Geist, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  .toast {
    position: absolute;
    right: 0; bottom: 0;
    width: 340px;
    padding: 14px 16px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)), #131316;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 50px rgba(0,0,0,.55);
    color: var(--text);
    transform: translateX(120%);
    opacity: 0;
    transition: transform .45s cubic-bezier(.2,.9,.25,1), opacity .35s ease;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .toast.show {
    transform: translateX(0);
    opacity: 1;
  }
  .toast.hide {
    transform: translateX(120%);
    opacity: 0;
    transition: transform .35s cubic-bezier(.4,0,.6,1), opacity .25s ease;
  }
  .icon {
    width: 26px; height: 26px;
    flex: none;
    border-radius: 8px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.08);
    color: var(--text);
  }
  .icon svg {
    width: 14px; height: 14px;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .icon.success { background: rgba(90,158,110,.18); color: #7ad79c; }
  .icon.warn    { background: rgba(200,150,60,.18); color: #eac070; }
  .icon.info    { background: rgba(120,150,220,.18); color: #9ab8ff; }

  .text { flex: 1; min-width: 0; }
  .title {
    font-size: 13px; font-weight: 600; line-height: 1.3;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .body {
    font-size: 12px; line-height: 1.45;
    color: var(--muted);
    margin-top: 3px;
    overflow-wrap: anywhere;
  }
  .progress {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
    border-radius: 0 0 14px 14px;
  }
  .progress i {
    display: block;
    height: 100%;
    width: 100%;
    background: #fff;
    transform-origin: left center;
  }
</style>
</head>
<body>
<div class="toast" id="toast">
  <div class="icon info" id="icon">
    <svg viewBox="0 0 24 24" id="iconSvg">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v.01M12 11v5"/>
    </svg>
  </div>
  <div class="text">
    <div class="title" id="title">Notification</div>
    <div class="body" id="body"></div>
  </div>
  <div class="progress"><i id="progressFill"></i></div>
</div>

<script>
(function(){
  var titleEl = document.getElementById("title");
  var bodyEl  = document.getElementById("body");
  var iconEl  = document.getElementById("icon");
  var iconSvg = document.getElementById("iconSvg");
  var toastEl = document.getElementById("toast");
  var progFill = document.getElementById("progressFill");

  var ICONS = {
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5"/>',
    success: '<path d="M5 12l5 5L20 7"/>',
    warn: '<path d="M12 3l10 18H2z"/><path d="M12 9v5M12 17v.01"/>'
  };

  var DURATION = 3.5;
  var mounted = false;

  window.__pushToast = function(payload){
    try {
      var t = payload && payload.title ? payload.title : "Notification";
      var b = payload && payload.body ? payload.body : "";
      var kind = payload && payload.kind ? payload.kind : "info";
      var dur = payload && payload.duration ? +payload.duration : DURATION;
      DURATION = dur;

      titleEl.textContent = t;
      bodyEl.textContent = b;
      bodyEl.style.display = b ? "block" : "none";

      iconEl.className = "icon " + kind;
      iconSvg.innerHTML = ICONS[kind] || ICONS.info;

      // Run the show animation
      requestAnimationFrame(function(){
        toastEl.classList.remove("hide");
        toastEl.classList.add("show");
      });

      // Progress bar countdown
      progFill.style.transition = "none";
      progFill.style.transform = "scaleX(1)";
      requestAnimationFrame(function(){
        progFill.style.transition = "transform " + dur + "s linear";
        progFill.style.transform = "scaleX(0)";
      });

      // Schedule the hide + finish
      setTimeout(function(){
        toastEl.classList.remove("show");
        toastEl.classList.add("hide");
        setTimeout(function(){
          try { window.pywebview.api.finish(); } catch (e) {}
        }, 400);
      }, dur * 1000);

      mounted = true;
    } catch (e) {
      try { window.pywebview.api.finish(); } catch (_) {}
    }
  };

  // If nothing is pushed within 1s, close empty
  setTimeout(function(){
    if (!mounted) {
      try { window.pywebview.api.finish(); } catch (e) {}
    }
  }, 1500);
})();
</script>
</body>
</html>
